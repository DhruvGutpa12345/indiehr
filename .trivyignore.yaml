# Reviewed Trivy exceptions (P1-T12). Each entry is scoped to a path and says why.
misconfigurations:
  # ---- infra/ (P1-T8b4, OpenTofu) ----
  - id: AWS-0107
    paths:
      - "infra/aws/server.tf"
    statement: >-
      Public server by design: 80/443 (the web app), 53 tcp+udp (acme-dns, the wildcard
      certificate's DNS check, P1-T8b2) and 22 (owner decision Q-E9, 09-11-2026: SSH open to the
      internet, key-only and rate-limited by deploy/host/bootstrap.sh; ssh_cidrs can narrow it).
  - id: AWS-0104
    paths:
      - "infra/aws/server.tf"
    statement: >-
      Egress is limited to the ports the server uses (80, 443, 587, 53 tcp/udp, 123/udp) but must
      reach any address: Ubuntu mirrors, Docker registries, Let's Encrypt, NIC/NPL time servers,
      the registrar's DNS servers and the mail service have no fixed address list.
  - id: AWS-0087
    paths:
      - "infra/aws/storage.tf"
    statement: >-
      Only the facility bucket (aws_s3_bucket_public_access_block.care["facility"]): its policy
      lets anyone GET a hospital picture, as CARE expects (no listing, no writes, no ACLs). The
      patient files and backup buckets block public policies (tests in infra/aws/tests).
  - id: AWS-0093
    paths:
      - "infra/aws/storage.tf"
    statement: Same facility bucket as AWS-0087; every other bucket restricts public buckets.
  - id: AWS-0132
    paths:
      - "infra/aws/storage.tf"
      - "infra/aws/anchor/main.tf"
    statement: >-
      Encrypted at rest with S3's own keys (SSE-S3, AES-256). A customer-managed KMS key is a
      provider-only service with no portable equivalent; ADR-011 rules require a new ADR first.
  - id: DS-0002
    paths:
      - "apps/backend/docker/dev.Dockerfile"
    statement: >-
      Upstream CARE dev/CI image only (volume-mounted source, make targets exec as root).
      Never deployed. Production uses apps/backend/docker/prod.Dockerfile, which runs as user 'django'.
  - id: DS-0002
    paths:
      - "apps/frontend/Dockerfile"
    statement: >-
      Upstream CARE frontend image, not used by IndieHR. We deploy deploy/docker/frontend.Dockerfile
      (nginx-unprivileged, non-root, port 8080).
  - id: DS-0029
    paths:
      - "apps/frontend/Dockerfile"
    statement: Same unused upstream image as above.
vulnerabilities:
  # ---- deploy/docker/keycloak.Dockerfile (P1-T8d1) ----
  - id: CVE-2026-102554
    paths:
      - "opt/keycloak/lib/lib/main/com.google.guava.guava-33.6.0-jre.jar"
    statement: >-
      Guava inside Keycloak 26.8.2 itself (fixed in Guava 33.7.2; no Keycloak release carries it
      yet, 2026-11-11). The flaw needs untrusted data fed to Java's native deserialization
      (ObjectInputStream) into CompactHashMap/MapMakerInternalMap (GHSA-mvr2-9pj6-7w5j). Keycloak
      reads JSON and forms, and with the single-node cache (KC_CACHE=local) it receives no
      serialized data from other nodes. Remove when a Keycloak release with Guava 33.7.2 or later
      is pinned; the expiry forces a fresh look.
    expired_at: 2026-12-31
