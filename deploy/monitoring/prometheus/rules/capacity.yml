# Capacity alerts (P1-T9a): disk, memory, CPU, the journal, Postgres, Redis and the Celery queue.
# Tests: ../tests/capacity.yml. Text from label values only.
groups:
  - name: capacity
    rules:
      - alert: DiskFreeLow
        # "/" holds the database, the journal and the images: its absolute floor counts. Any other
        # data mount must also be low in proportion (a small volume is not "full" at 20 GB).
        # /boot and /boot/efi (about 1 GB on Ubuntu cloud images) are never watched.
        expr: >-
          node_filesystem_avail_bytes{fstype=~"ext4|xfs|btrfs", mountpoint="/"} < 20e9
          or (node_filesystem_avail_bytes{fstype=~"ext4|xfs|btrfs", mountpoint!~"/|/boot(/.*)?"} < 20e9
            and node_filesystem_avail_bytes{fstype=~"ext4|xfs|btrfs", mountpoint!~"/|/boot(/.*)?"}
              / node_filesystem_size_bytes{fstype=~"ext4|xfs|btrfs", mountpoint!~"/|/boot(/.*)?"} < 0.25)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Less than 20 GB free on {{ $labels.mountpoint }}"

      - alert: DiskFreeLow
        # "/" holds the database, the journal and the images: its absolute floor counts. Any other
        # data mount must also be low in proportion (a small volume is not "full" at 20 GB).
        # /boot and /boot/efi (about 1 GB on Ubuntu cloud images) are never watched.
        expr: >-
          node_filesystem_avail_bytes{fstype=~"ext4|xfs|btrfs", mountpoint="/"} < 12e9
          or (node_filesystem_avail_bytes{fstype=~"ext4|xfs|btrfs", mountpoint!~"/|/boot(/.*)?"} < 12e9
            and node_filesystem_avail_bytes{fstype=~"ext4|xfs|btrfs", mountpoint!~"/|/boot(/.*)?"}
              / node_filesystem_size_bytes{fstype=~"ext4|xfs|btrfs", mountpoint!~"/|/boot(/.*)?"} < 0.15)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Less than 12 GB free on {{ $labels.mountpoint }}: the journal starts deleting logs early, then the database stops"

      - alert: DiskFillingUp
        expr: >-
          predict_linear(node_filesystem_avail_bytes{fstype=~"ext4|xfs|btrfs", mountpoint!~"/boot(/.*)?"}[6h], 7 * 86400) < 12e9
          and node_filesystem_avail_bytes{fstype=~"ext4|xfs|btrfs", mountpoint!~"/boot(/.*)?"} >= 20e9
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "At the last 6 hours' rate, {{ $labels.mountpoint }} falls below 12 GB free within 7 days"

      - alert: MemoryLow
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Less than 10% of memory available"

      - alert: MemoryLow
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Less than 5% of memory available"

      - alert: OomKill
        expr: increase(node_vmstat_oom_kill[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "The kernel killed a process for lack of memory in the last 15 minutes"

      - alert: SwapInUse
        expr: node_memory_SwapTotal_bytes - node_memory_SwapFree_bytes > 1e9
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "More than 1 GB of swap in use"

      # Each container's working set (cgroup v2 memory.current minus inactive_file, as docker
      # stats; host timer) against its mem_limit. Page cache the kernel can drop does not count:
      # Postgres, Prometheus and the backup fill their limit with it in normal work.
      - alert: ContainerMemoryNearLimit
        expr: ihr_container_memory_working_set_bytes / ihr_container_memory_limit_bytes > 0.9 and ihr_container_memory_limit_bytes > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.service }} uses more than 90% of its memory limit"

      - alert: CpuLoadHigh
        expr: node_load5 / on(instance) count by (instance) (node_cpu_seconds_total{mode="idle"}) > 2
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Load average over twice the number of CPUs for 15 minutes"

      # The journal holds the logs until P1-T9b/c: near its cap it deletes the oldest days
      - alert: JournalNearCap
        expr: ihr_journal_disk_usage_bytes / ihr_journal_max_use_bytes > 0.9 and ihr_journal_max_use_bytes > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "The journal uses more than 90% of its cap: the oldest logs are about to go"

      # journald dropped lines (rate limit): log lines are missing
      - alert: JournalSuppressed
        expr: ihr_journal_suppressed_lines > 0
        labels:
          severity: warning
        annotations:
          summary: "journald suppressed log lines in the last 15 minutes (rate limit)"

      - alert: PgConnectionsHigh
        expr: sum(pg_stat_activity_count) > 80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "More than 80 of 100 database connections in use"

      - alert: PgLongTransaction
        expr: max(pg_stat_activity_max_tx_duration{state!="idle"}) > 3600
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "A database transaction has been open for more than an hour"

      # noeviction: a full Redis refuses writes, and staff sign-ins fail
      - alert: RedisMemoryHigh
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.8 and redis_memory_max_bytes > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Redis uses more than 80% of its maxmemory (it refuses writes when full)"

      - alert: RedisMemoryHigh
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.9 and redis_memory_max_bytes > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Redis uses more than 90% of its maxmemory: sign-ins fail when it is full"

      - alert: RedisPersistenceFailing
        expr: redis_rdb_last_bgsave_status == 0 or redis_aof_last_write_status == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Redis cannot write its data to disk (sessions would be lost on a restart)"

      - alert: CeleryBacklog
        expr: redis_key_size{key="celery"} > 200
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "More than 200 background tasks waiting for 10 minutes"
