# Time, certificates, DNS for renewals, and the Keycloak client keys (P1-T9a).
# Tests: ../tests/time-certs-keys.yml. Text from label values only.
groups:
  - name: time
    rules:
      # CERT-In: clocks synced to NIC/NPL (deploy/host/bootstrap.sh sets up chrony)
      - alert: NtpUnsynced
        expr: node_timex_sync_status == 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "The server clock is not synchronised"

      # chrony's own offset (tracking, read as root by the host timer's unit). The kernel's
      # node_timex_offset_seconds stays 0 under chrony, which never uses the kernel PLL.
      - alert: NtpOffset
        expr: abs(ihr_ntp_offset_seconds) > 0.1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "The server clock is more than 100 ms off"

      - alert: NtpOffset
        expr: abs(ihr_ntp_offset_seconds) > 1
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "The server clock is more than 1 s off"

      # The selected source must be one of the NIC/NPL servers (host timer reads chrony)
      - alert: NtpSourceNotIndian
        expr: ihr_ntp_indian_source_selected == 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "chrony is not following a NIC or NPL time server (CERT-In)"

      # The source and offset above are unknown, not bad: the unit's root step could not read
      # chrony (sudo systemctl status ihr-host-metrics; deploy/host/bootstrap.sh --check)
      - alert: NtpReadingFailed
        expr: ihr_ntp_reading_ok == 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "The host timer cannot read chrony: the time source and offset are not watched (CERT-In)"

  - name: certificates
    rules:
      - alert: TlsCertExpiry
        expr: (probe_ssl_earliest_cert_expiry{job="probe-public"} - time()) / 86400 < 21
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "The certificate of {{ $labels.endpoint }} expires in under 21 days (renewal should have happened at 30)"

      - alert: TlsCertExpiry
        expr: (probe_ssl_earliest_cert_expiry{job="probe-public"} - time()) / 86400 < 7
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "The certificate of {{ $labels.endpoint }} expires in under 7 days"

      # Renewals need acme-dns to answer Let's Encrypt
      - alert: AcmeDnsDown
        expr: probe_success{job="probe-dns"} == 0
        for: 30m
        labels:
          severity: warning
          service: acme-dns
        annotations:
          summary: "acme-dns does not answer DNS: certificate renewals will fail"

  - name: client-keys
    rules:
      # Rotate every 180 days (scripts/staging.sh keys rotate): warn from 150, critical at 365
      - alert: ClientKeyAge
        expr: ihr_client_key_active_age_days >= 150
        labels:
          severity: warning
        annotations:
          summary: "The {{ $labels.purpose }} client key is {{ $value | printf \"%.0f\" }} days old: rotate it (scripts/staging.sh keys rotate {{ $labels.purpose }})"

      - alert: ClientKeyAge
        expr: ihr_client_key_active_age_days >= 365
        labels:
          severity: critical
        annotations:
          summary: "The {{ $labels.purpose }} client key is {{ $value | printf \"%.0f\" }} days old: rotate it now"

      - alert: ClientKeyMissing
        expr: ihr_client_key_active == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "No active {{ $labels.purpose }} client key: it cannot sign in to Keycloak"

      # The key check runs hourly on the host
      - alert: ClientKeyCheckStale
        expr: time() - ihr_client_keys_checked_timestamp_seconds > 3 * 3600
        labels:
          severity: warning
        annotations:
          summary: "The client keys have not been checked for more than 3 hours"

      # Never read on this server (the file is written only after a good read): the key-age and
      # missing-key alerts above have nothing to look at. Allows the first hourly run.
      - alert: ClientKeyCheckStale
        expr: absent(ihr_client_keys_checked_timestamp_seconds)
        for: 2h
        labels:
          severity: warning
        annotations:
          summary: "The client keys have never been checked on this server (scripts/staging.sh monitoring-textfile --keys says why)"
