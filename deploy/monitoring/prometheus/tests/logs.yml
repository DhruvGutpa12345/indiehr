# promtool unit tests for ../rules/logs.yml (scripts/check-monitoring.sh runs them with the
# pinned Prometheus image).
rule_files:
  - ../rules/logs.yml
evaluation_interval: 30s

tests:
  - name: redaction drops and shipping failures
    interval: 1m
    input_series:
      - series: 'fluentbit_filter_drop_records_total{name="redact", job="fluent-bit"}'
        values: '0x10 3x30'
      - series: 'fluentbit_filter_drop_records_total{name="shape", job="fluent-bit"}'
        values: '0x40'
      - series: 'fluentbit_output_errors_total{name="victorialogs", job="fluent-bit"}'
        values: '0x5 1+1x40'
      - series: 'fluentbit_output_dropped_records_total{name="victorialogs", job="fluent-bit"}'
        values: '0x20 5x20'
      - series: 'fluentbit_output_retries_failed_total{name="victorialogs", job="fluent-bit"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 9m
        alertname: LogRedactionDrops
        exp_alerts: []
      - eval_time: 12m
        alertname: LogRedactionDrops
        exp_alerts:
          - exp_labels: {severity: warning, service: fluent-bit}
            exp_annotations:
              summary: "The log redaction dropped 3 lines in 15 minutes (a script error; they are not in the log store)"
      - eval_time: 35m
        alertname: LogRedactionDrops
        exp_alerts: []
      # errors from minute 6: pending from about 7m, firing 15 minutes later
      - eval_time: 18m
        alertname: LogShippingFailing
        exp_alerts: []
      - eval_time: 25m
        alertname: LogShippingFailing
        exp_alerts:
          - exp_labels: {severity: warning, service: fluent-bit}
            exp_annotations:
              summary: "Fluent Bit cannot hand lines to the log store for 15 minutes (they wait on disk)"
      - eval_time: 19m
        alertname: LogLinesLost
        exp_alerts: []
      - eval_time: 22m
        alertname: LogLinesLost
        exp_alerts:
          - exp_labels: {severity: warning, service: fluent-bit}
            exp_annotations:
              summary: "Fluent Bit gave up on some lines (its disk buffer was full); they are only in the server's journal"

  - name: the store
    interval: 1m
    input_series:
      # lines arrive for 20 minutes, then stop
      - series: 'vl_rows_ingested_total{type="jsonline", job="victorialogs"}'
        values: '0+100x20 2000x60'
      - series: 'up{job="victorialogs"}'
        values: '1x80'
      - series: 'vl_rows_dropped_total{reason="too_many_fields", job="victorialogs"}'
        values: '0x10 2x70'
      - series: 'vl_too_long_lines_skipped_total{job="victorialogs"}'
        values: '0x80'
      - series: 'vl_storage_is_read_only{path="/vlogs", job="victorialogs"}'
        values: '0x50 1x30'
      - series: 'vl_data_size_bytes{type="storage", job="victorialogs"}'
        values: '800x10 900x70'
      - series: 'vl_data_size_bytes{type="indexdb", job="victorialogs"}'
        values: '0x80'
      - series: 'ihr_logs_max_bytes{job="node"}'
        values: '1000x80'
    alert_rule_test:
      - eval_time: 20m
        alertname: LogIngestStalled
        exp_alerts: []
      # no new lines from minute 20: rate 0 from about 35m, firing 15 minutes later
      - eval_time: 45m
        alertname: LogIngestStalled
        exp_alerts: []
      - eval_time: 52m
        alertname: LogIngestStalled
        exp_alerts:
          - exp_labels: {severity: warning, service: victorialogs}
            exp_annotations:
              summary: "The log store received no lines for 30 minutes"
      - eval_time: 30m
        alertname: LogLinesRejected
        exp_alerts:
          - exp_labels: {severity: warning, service: victorialogs}
            exp_annotations:
              summary: "The log store refused 2 lines in the last hour (too long, too many fields, or a wrong time)"
      - eval_time: 54m
        alertname: LogStoreReadOnly
        exp_alerts: []
      - eval_time: 57m
        alertname: LogStoreReadOnly
        exp_alerts:
          - exp_labels: {severity: critical, service: victorialogs}
            exp_annotations:
              summary: "The log store has switched to read-only (disk full): no lines are being stored"
      # 900 of 1000 from minute 10: above 85 % for an hour
      - eval_time: 65m
        alertname: LogStoreNearCap
        exp_alerts: []
      - eval_time: 75m
        alertname: LogStoreNearCap
        exp_alerts:
          - exp_labels: {severity: warning, service: victorialogs}
            exp_annotations:
              summary: "The log store uses more than 85 % of its cap (IHR_LOGS_MAX_SIZE): its oldest days will be deleted early"

  - name: log alerts failing
    interval: 1m
    input_series:
      - series: 'vmalert_execution_errors_total{group="sign-in-abuse", job="vmalert"}'
        values: '0x5 1+1x40'
      - series: 'vmalert_alerts_send_errors_total{addr="x", job="vmalert"}'
        values: '0x45'
    alert_rule_test:
      - eval_time: 15m
        alertname: LogAlertsFailing
        exp_alerts: []
      - eval_time: 25m
        alertname: LogAlertsFailing
        exp_alerts:
          - exp_labels: {severity: warning, service: vmalert}
            exp_annotations:
              summary: "Log alerts fail to run or to reach Alertmanager (sign-in abuse would go unnoticed)"

  - name: log archive
    interval: 1m
    input_series:
      # the newest archived day ended at time 0; nothing newer for 100 hours
      - series: 'ihr_logs_archive_last_day_end_timestamp_seconds'
        values: '0x6000'
      # passes fail from 4 h to 14 h
      - series: 'ihr_logs_archive_last_run_ok'
        values: '1x240 0x600 1x5200'
      - series: 'ihr_logs_archive_bad_manifests'
        values: '0x1260 1x4800'
      # from 10 h a recent day has fewer lines in the store than in its archive
      # the weekly full check finds a problem from 30 h; the lock is gone from 40 h
      - series: 'ihr_logs_archive_check_problems'
        values: '0x1800 1x4200'
      - series: 'ihr_logs_archive_bucket_locked'
        values: '1x2400 0x3600'
      - series: 'ihr_logs_archive_shrunk_days'
        values: '0x600 1x5400'
      # the oldest day began 434 days before time 0: overdue (435 days) after a day
      - series: 'ihr_logs_archive_oldest_day_timestamp_seconds'
        values: '-37497600x6000'
    alert_rule_test:
      - eval_time: 29h
        alertname: LogArchiveBehind
        exp_alerts: []
      - eval_time: 31h
        alertname: LogArchiveBehind
        exp_alerts:
          - exp_labels: {severity: warning, service: logs-archive}
            exp_annotations:
              summary: "The log archive is more than a day behind (scripts/staging.sh logs-archive-check; the archiver's own log says why)"
      - eval_time: 97h
        alertname: LogArchiveBehind
        exp_alerts:
          - exp_labels: {severity: warning, service: logs-archive}
            exp_annotations:
              summary: "The log archive is more than a day behind (scripts/staging.sh logs-archive-check; the archiver's own log says why)"
          - exp_labels: {severity: critical, service: logs-archive}
            exp_annotations:
              summary: "The log archive is more than 4 days behind: days that leave the store unarchived are lost to the 400-day record"
      - eval_time: 4h
        alertname: LogArchiveFailing
        exp_alerts: []
      - eval_time: 7h
        alertname: LogArchiveFailing
        exp_alerts:
          - exp_labels: {severity: warning, service: logs-archive}
            exp_annotations:
              summary: "The log archiver's passes fail for 2 hours (bucket, key or the store; its own log says why)"
      - eval_time: 20h
        alertname: LogArchiveNotAuthentic
        exp_alerts: []
      - eval_time: 22h
        alertname: LogArchiveNotAuthentic
        exp_alerts:
          - exp_labels: {severity: critical, service: logs-archive}
            exp_annotations:
              summary: "The log archive holds something not ours, a changed file, a broken chain or a revision that drops lines (scripts/staging.sh logs-archive-check --deep)"
      - eval_time: 10h
        alertname: LogArchiveErasureOverdue
        exp_alerts: []
      - eval_time: 26h
        alertname: LogArchiveErasureOverdue
        exp_alerts:
          - exp_labels: {severity: warning, service: logs-archive}
            exp_annotations:
              summary: "Archived log days older than 400 days wait for erasure: run scripts/staging.sh logs-archive-expire from your machine"
      - eval_time: 10h30m
        alertname: LogArchiveShrunk
        exp_alerts: []
      - eval_time: 12h
        alertname: LogArchiveShrunk
        exp_alerts:
          - exp_labels: {severity: warning, service: logs-archive}
            exp_annotations:
              summary: "The log store now holds fewer lines of a recent day than its archive (lines deleted from the store?)"
      - eval_time: 41h
        alertname: LogArchiveNotAuthentic
        exp_alerts:
          - exp_labels: {severity: critical, service: logs-archive}
            exp_annotations:
              summary: "The log archive holds something not ours, a changed file, a broken chain or a revision that drops lines (scripts/staging.sh logs-archive-check --deep)"

  - name: log archive not locked
    interval: 1m
    input_series:
      - series: 'ihr_logs_archive_bucket_locked'
        values: '1x20 0x60'
      - series: 'ihr_logs_archive_bad_manifests'
        values: '0x80'
    alert_rule_test:
      - eval_time: 40m
        alertname: LogArchiveNotLocked
        exp_alerts: []
      - eval_time: 55m
        alertname: LogArchiveNotLocked
        exp_alerts:
          - exp_labels: {severity: critical, service: logs-archive}
            exp_annotations:
              summary: "The log archive bucket is not locked for 400 days with versioning: archived days could be deleted"
