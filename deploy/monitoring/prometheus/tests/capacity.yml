# promtool unit tests for ../rules/capacity.yml (scripts/check-monitoring.sh).
rule_files:
  - ../rules/capacity.yml
evaluation_interval: 30s

tests:
  - name: disk
    interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{fstype="ext4", mountpoint="/"}'
        values: '10e9x20'
      - series: 'node_filesystem_size_bytes{fstype="ext4", mountpoint="/"}'
        values: '100e9x20'
      # 15 GB of 100 GB free: low in both senses (warning only)
      - series: 'node_filesystem_avail_bytes{fstype="ext4", mountpoint="/data"}'
        values: '15e9x20'
      - series: 'node_filesystem_size_bytes{fstype="ext4", mountpoint="/data"}'
        values: '100e9x20'
      - series: 'node_filesystem_avail_bytes{fstype="tmpfs", mountpoint="/run"}'
        values: '1e6x20'
      # Ubuntu cloud images: a separate ext4 /boot of about 1 GB (and a vfat /boot/efi). Never.
      - series: 'node_filesystem_avail_bytes{fstype="ext4", mountpoint="/boot"}'
        values: '0.6e9x20'
      - series: 'node_filesystem_size_bytes{fstype="ext4", mountpoint="/boot"}'
        values: '1e9x20'
      - series: 'node_filesystem_avail_bytes{fstype="vfat", mountpoint="/boot/efi"}'
        values: '0.1e9x20'
      # A small volume, mostly free: under 20 GB but not low
      - series: 'node_filesystem_avail_bytes{fstype="xfs", mountpoint="/srv/small"}'
        values: '3e9x20'
      - series: 'node_filesystem_size_bytes{fstype="xfs", mountpoint="/srv/small"}'
        values: '4e9x20'
    alert_rule_test:
      - eval_time: 6m
        alertname: DiskFreeLow
        exp_alerts:
          - exp_labels: {severity: critical, fstype: ext4, mountpoint: /}
            exp_annotations:
              summary: "Less than 12 GB free on /: the journal starts deleting logs early, then the database stops"
      - eval_time: 11m
        alertname: DiskFreeLow
        exp_alerts:
          - exp_labels: {severity: warning, fstype: ext4, mountpoint: /}
            exp_annotations:
              summary: "Less than 20 GB free on /"
          - exp_labels: {severity: warning, fstype: ext4, mountpoint: /data}
            exp_annotations:
              summary: "Less than 20 GB free on /data"
          - exp_labels: {severity: critical, fstype: ext4, mountpoint: /}
            exp_annotations:
              summary: "Less than 12 GB free on /: the journal starts deleting logs early, then the database stops"

  - name: disk filling up
    interval: 1m
    input_series:
      # 100 GB free, 100 MB less every minute: 12 GB is reached in under 7 days
      - series: 'node_filesystem_avail_bytes{fstype="ext4", mountpoint="/"}'
        values: '100e9-1e8x500'
      # /boot shrinking too (kernel updates): never watched
      - series: 'node_filesystem_avail_bytes{fstype="ext4", mountpoint="/boot"}'
        values: '30e9-1e8x500'
    alert_rule_test:
      - eval_time: 30m
        alertname: DiskFillingUp
        exp_alerts: []
      - eval_time: 7h
        alertname: DiskFillingUp
        exp_alerts:
          - exp_labels: {severity: warning, fstype: ext4, mountpoint: /}
            exp_annotations:
              summary: "At the last 6 hours' rate, / falls below 12 GB free within 7 days"

  - name: memory
    interval: 1m
    input_series:
      - series: 'node_memory_MemAvailable_bytes{instance="n"}'
        values: '8x20'
      - series: 'node_memory_MemTotal_bytes{instance="n"}'
        values: '100x20'
      - series: 'node_vmstat_oom_kill{instance="n"}'
        values: '0 0 0 1x10'
      - series: 'node_memory_SwapTotal_bytes{instance="n"}'
        values: '2e9x20'
      - series: 'node_memory_SwapFree_bytes{instance="n"}'
        values: '0.5e9x20'
      - series: 'ihr_container_memory_working_set_bytes{service="keycloak"}'
        values: '950x20'
      - series: 'ihr_container_memory_limit_bytes{service="keycloak"}'
        values: '1000x20'
      - series: 'ihr_container_memory_working_set_bytes{service="redis"}'
        values: '100x20'
      - series: 'ihr_container_memory_limit_bytes{service="redis"}'
        values: '1000x20'
      - series: 'node_load5{instance="n"}'
        values: '9x20'
      - series: 'node_cpu_seconds_total{instance="n", cpu="0", mode="idle"}'
        values: '0+60x20'
      - series: 'node_cpu_seconds_total{instance="n", cpu="1", mode="idle"}'
        values: '0+60x20'
      - series: 'node_cpu_seconds_total{instance="n", cpu="2", mode="idle"}'
        values: '0+60x20'
      - series: 'node_cpu_seconds_total{instance="n", cpu="3", mode="idle"}'
        values: '0+60x20'
    alert_rule_test:
      - eval_time: 11m
        alertname: MemoryLow
        exp_alerts:
          - exp_labels: {severity: warning, instance: n}
            exp_annotations:
              summary: "Less than 10% of memory available"
      - eval_time: 5m
        alertname: OomKill
        exp_alerts:
          - exp_labels: {severity: warning, instance: n}
            exp_annotations:
              summary: "The kernel killed a process for lack of memory in the last 15 minutes"
      - eval_time: 16m
        alertname: SwapInUse
        exp_alerts:
          - exp_labels: {severity: warning, instance: n}
            exp_annotations:
              summary: "More than 1 GB of swap in use"
      - eval_time: 16m
        alertname: ContainerMemoryNearLimit
        exp_alerts:
          - exp_labels: {severity: warning, service: keycloak}
            exp_annotations:
              summary: "Container keycloak uses more than 90% of its memory limit"
      - eval_time: 16m
        alertname: CpuLoadHigh
        exp_alerts:
          - exp_labels: {severity: warning, instance: n}
            exp_annotations:
              summary: "Load average over twice the number of CPUs for 15 minutes"

  - name: memory critical
    interval: 1m
    input_series:
      - series: 'node_memory_MemAvailable_bytes{instance="n"}'
        values: '4x20'
      - series: 'node_memory_MemTotal_bytes{instance="n"}'
        values: '100x20'
    alert_rule_test:
      - eval_time: 11m
        alertname: MemoryLow
        exp_alerts:
          - exp_labels: {severity: warning, instance: n}
            exp_annotations:
              summary: "Less than 10% of memory available"
          - exp_labels: {severity: critical, instance: n}
            exp_annotations:
              summary: "Less than 5% of memory available"

  - name: journal
    interval: 1m
    input_series:
      - series: 'ihr_journal_disk_usage_bytes{instance="n"}'
        values: '19e9x40'
      - series: 'ihr_journal_max_use_bytes{instance="n"}'
        values: '20e9x40'
      - series: 'ihr_journal_suppressed_lines{instance="n"}'
        values: '0 0 3'
    alert_rule_test:
      - eval_time: 31m
        alertname: JournalNearCap
        exp_alerts:
          - exp_labels: {severity: warning, instance: n}
            exp_annotations:
              summary: "The journal uses more than 90% of its cap: the oldest logs are about to go"
      - eval_time: 1m
        alertname: JournalSuppressed
        exp_alerts: []
      - eval_time: 2m
        alertname: JournalSuppressed
        exp_alerts:
          - exp_labels: {severity: warning, instance: n}
            exp_annotations:
              summary: "journald suppressed log lines in the last 15 minutes (rate limit)"

  - name: postgres
    interval: 1m
    input_series:
      - series: 'pg_stat_activity_count{datname="ihr", state="active"}'
        values: '50x20'
      - series: 'pg_stat_activity_count{datname="keycloak", state="idle"}'
        values: '35x20'
      - series: 'pg_stat_activity_max_tx_duration{datname="ihr", state="active"}'
        values: '4000x20'
      - series: 'pg_stat_activity_max_tx_duration{datname="ihr", state="idle"}'
        values: '99999x20'
    alert_rule_test:
      - eval_time: 11m
        alertname: PgConnectionsHigh
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "More than 80 of 100 database connections in use"
      - eval_time: 6m
        alertname: PgLongTransaction
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "A database transaction has been open for more than an hour"

  - name: redis and celery
    interval: 1m
    input_series:
      - series: 'redis_memory_used_bytes{job="redis"}'
        values: '95x20'
      - series: 'redis_memory_max_bytes{job="redis"}'
        values: '100x20'
      - series: 'redis_rdb_last_bgsave_status{job="redis"}'
        values: '0x20'
      - series: 'redis_aof_last_write_status{job="redis"}'
        values: '1x20'
      - series: 'redis_key_size{job="redis", db="db0", key="celery"}'
        values: '300x20'
    alert_rule_test:
      - eval_time: 11m
        alertname: RedisMemoryHigh
        exp_alerts:
          - exp_labels: {severity: warning, job: redis}
            exp_annotations:
              summary: "Redis uses more than 80% of its maxmemory (it refuses writes when full)"
          - exp_labels: {severity: critical, job: redis}
            exp_annotations:
              summary: "Redis uses more than 90% of its maxmemory: sign-ins fail when it is full"
      - eval_time: 6m
        alertname: RedisPersistenceFailing
        exp_alerts:
          - exp_labels: {severity: critical, job: redis}
            exp_annotations:
              summary: "Redis cannot write its data to disk (sessions would be lost on a restart)"
      - eval_time: 11m
        alertname: CeleryBacklog
        exp_alerts:
          - exp_labels: {severity: warning, job: redis, db: db0, key: celery}
            exp_annotations:
              summary: "More than 200 background tasks waiting for 10 minutes"

  - name: nothing fires on a healthy server
    interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{fstype="ext4", mountpoint="/"}'
        values: '60e9x30'
      - series: 'node_filesystem_size_bytes{fstype="ext4", mountpoint="/"}'
        values: '100e9x30'
      - series: 'node_filesystem_avail_bytes{fstype="ext4", mountpoint="/boot"}'
        values: '0.6e9x30'
      - series: 'node_filesystem_size_bytes{fstype="ext4", mountpoint="/boot"}'
        values: '1e9x30'
      - series: 'node_memory_MemAvailable_bytes{instance="n"}'
        values: '50x30'
      - series: 'node_memory_MemTotal_bytes{instance="n"}'
        values: '100x30'
      - series: 'redis_memory_used_bytes{job="redis"}'
        values: '10x30'
      - series: 'redis_memory_max_bytes{job="redis"}'
        values: '100x30'
      - series: 'redis_key_size{job="redis", db="db0", key="celery"}'
        values: '3x30'
    alert_rule_test:
      - {eval_time: 25m, alertname: DiskFreeLow, exp_alerts: []}
      - {eval_time: 25m, alertname: DiskFillingUp, exp_alerts: []}
      - {eval_time: 25m, alertname: MemoryLow, exp_alerts: []}
      - {eval_time: 25m, alertname: RedisMemoryHigh, exp_alerts: []}
      - {eval_time: 25m, alertname: CeleryBacklog, exp_alerts: []}
