# promtool unit tests for ../rules/backups.yml (scripts/check-monitoring.sh).
rule_files:
  - ../rules/backups.yml
evaluation_interval: 30s

tests:
  - name: backup service failing
    interval: 1m
    input_series:
      - series: 'ihr_backup_healthy{instance="n"}'
        values: '1 0x20'
      - series: 'ihr_backup_spool_oldest_seconds{instance="n"}'
        values: '0 700'
      - series: 'ihr_backup_spool_bytes{instance="n"}'
        values: '1.6e9x10'
      - series: 'ihr_backup_spool_max_bytes{instance="n"}'
        values: '2e9x10'
      - series: 'pg_stat_archiver_failed_count{job="postgres"}'
        values: '0 0 0 1x5'
    alert_rule_test:
      - eval_time: 10m
        alertname: BackupUnhealthy
        exp_alerts: []
      - eval_time: 17m
        alertname: BackupUnhealthy
        exp_alerts:
          - exp_labels: {severity: critical, service: backup, instance: n}
            exp_annotations:
              summary: "The backup service reports unhealthy (scripts/staging.sh backup-status says why)"
      - eval_time: 1m
        alertname: WalSpoolStuck
        exp_alerts:
          - exp_labels: {severity: critical, service: backup, instance: n}
            exp_annotations:
              summary: "A WAL file has waited more than 10 minutes in the spool"
      - eval_time: 6m
        alertname: WalSpoolNearCap
        exp_alerts:
          - exp_labels: {severity: critical, service: backup, instance: n}
            exp_annotations:
              summary: "The WAL spool is more than 75% full"
      - eval_time: 4m
        alertname: WalArchiveFailing
        exp_alerts:
          - exp_labels: {severity: critical, service: backup, job: postgres}
            exp_annotations:
              summary: "Postgres failed to archive WAL in the last 15 minutes"

  - name: last backup and check too old
    interval: 1h
    input_series:
      # last good backup and last good check both at 00:00
      - series: 'ihr_backup_last_success_timestamp_seconds{instance="n"}'
        values: '0x30'
      - series: 'ihr_backup_last_check_timestamp_seconds{instance="n"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 25h
        alertname: BackupTooOld
        exp_alerts: []
      - eval_time: 27h
        alertname: BackupTooOld
        exp_alerts:
          - exp_labels: {severity: critical, service: backup, instance: n}
            exp_annotations:
              summary: "No good database backup for more than 26 hours"
      - eval_time: 1h
        alertname: BackupCheckStale
        exp_alerts: []
      - eval_time: 3h
        alertname: BackupCheckStale
        exp_alerts:
          - exp_labels: {severity: critical, service: backup, instance: n}
            exp_annotations:
              summary: "No passing archive check for more than 2 hours: WAL may not reach the backup bucket"

  - name: a stack without backups raises nothing
    interval: 1m
    input_series: []
    alert_rule_test:
      - {eval_time: 30m, alertname: BackupUnhealthy, exp_alerts: []}
      - {eval_time: 30m, alertname: BackupTooOld, exp_alerts: []}
      - {eval_time: 30m, alertname: WalSpoolStuck, exp_alerts: []}
