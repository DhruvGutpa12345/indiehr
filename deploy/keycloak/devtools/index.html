<!doctype html>
<!-- IndieHR dev token viewer (P1-T3). Local development only: served by
     `scripts/care-dev.sh keycloak devtools` at http://<hospital>.localhost:8082/.
     Signs in to the hospital's Keycloak client (code flow + PKCE) and shows the token claims.
     Tokens stay in this page's memory; nothing is stored. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IndieHR sign-in check</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; margin: 2rem auto; max-width: 52rem; padding: 0 1rem; color: #1f2937; }
  h1 { font-size: 1.3rem; } code, pre { font: 13px ui-monospace, monospace; }
  pre { background: #f3f4f6; padding: 1rem; overflow-x: auto; border-radius: 6px; }
  button { font: inherit; padding: .5rem 1rem; border-radius: 6px; border: 1px solid #0f766e; background: #0f766e; color: #fff; cursor: pointer; }
  button.secondary { background: #fff; color: #0f766e; }
  table { border-collapse: collapse; margin: 1rem 0; } td { padding: .25rem .75rem .25rem 0; vertical-align: top; }
  .ok { color: #047857; font-weight: 600; } .bad { color: #b91c1c; font-weight: 600; }
</style>
</head>
<body>
<h1>Sign-in check: <span id="hospital"></span></h1>
<p>Local development page. It signs in through Keycloak for this hospital and shows what the token says.</p>
<p id="actions"><button id="signin">Sign in</button></p>
<div id="out"></div>
<script>
const KEYCLOAK = "http://auth.localhost:8081/realms/indiehr/protocol/openid-connect";
const slug = location.hostname.split(".")[0];
const clientId = "ihr-h-" + slug;
const redirectUri = location.origin + "/";
document.getElementById("hospital").textContent = slug;

const b64url = (bytes) => btoa(String.fromCharCode(...new Uint8Array(bytes)))
  .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const random = () => b64url(crypto.getRandomValues(new Uint8Array(32)));
const claims = (jwt) => JSON.parse(decodeURIComponent(escape(atob(
  jwt.split(".")[1].replace(/-/g, "+").replace(/_/g, "/")))));
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));

document.getElementById("signin").onclick = async () => {
  const verifier = random(), state = random();
  sessionStorage.setItem("pkce", JSON.stringify({verifier, state}));
  const challenge = b64url(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier)));
  location.assign(KEYCLOAK + "/auth?" + new URLSearchParams({
    client_id: clientId, redirect_uri: redirectUri, response_type: "code", scope: "openid",
    state, nonce: random(), code_challenge: challenge, code_challenge_method: "S256",
  }));
};

async function finish() {
  const params = new URLSearchParams(location.search);
  if (!params.has("code") && !params.has("error")) return;
  const saved = JSON.parse(sessionStorage.getItem("pkce") || "{}");
  sessionStorage.removeItem("pkce");
  history.replaceState(null, "", "/");
  const out = document.getElementById("out");
  if (params.get("state") !== saved.state) { out.innerHTML = '<p class="bad">State mismatch: sign in again.</p>'; return; }
  if (params.has("error")) { out.innerHTML = `<p class="bad">Keycloak refused: ${esc(params.get("error"))}</p>`; return; }
  const resp = await fetch(KEYCLOAK + "/token", {method: "POST", body: new URLSearchParams({
    grant_type: "authorization_code", code: params.get("code"), redirect_uri: redirectUri,
    client_id: clientId, code_verifier: saved.verifier})});
  const tokens = await resp.json();
  if (!resp.ok) { out.innerHTML = `<p class="bad">Token request failed: ${esc(tokens.error)}</p>`; return; }
  const a = claims(tokens.access_token);
  const roles = (a.resource_access && a.resource_access[clientId] || {}).roles || [];
  const check = (good, text) => `<span class="${good ? "ok" : "bad"}">${esc(text)}</span>`;
  out.innerHTML = `<table>
    <tr><td>Signed in as</td><td>${esc(a.preferred_username)} (${esc(a.name || "")})</td></tr>
    <tr><td>Hospital in token</td><td>${check(a.ihr_org && a.ihr_org.alias === slug, a.ihr_org ? a.ihr_org.alias + " (organisation " + a.ihr_org.id + ")" : "none")}</td></tr>
    <tr><td>Roles for this hospital</td><td>${check(roles.includes("member"), roles.join(", ") || "none")}</td></tr>
    <tr><td>Second factor used</td><td>${check(a.acr === "mfa", a.acr === "mfa" ? "yes (acr = mfa)" : "no (acr = " + a.acr + ")")}</td></tr>
    <tr><td>Token lifetime</td><td>${a.exp - a.iat} seconds</td></tr>
    <tr><td>Other hospitals in token</td><td>${check(Object.keys(a.resource_access || {}).every((k) => k === clientId), Object.keys(a.resource_access || {}).filter((k) => k !== clientId).join(", ") || "none")}</td></tr>
  </table>
  <p><button class="secondary" id="signout">Sign out</button></p>
  <h2>Access token claims</h2><pre>${esc(JSON.stringify(a, null, 2))}</pre>`;
  document.getElementById("signout").onclick = () => location.assign(KEYCLOAK + "/logout?" +
    new URLSearchParams({id_token_hint: tokens.id_token, post_logout_redirect_uri: redirectUri, client_id: clientId}));
}
finish();
</script>
</body>
</html>
