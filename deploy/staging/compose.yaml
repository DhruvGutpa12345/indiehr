# IndieHR staging stack (P1-T8a): one VM, Docker Compose, Traefik in front (ADR-003).
# Run through scripts/staging.sh, never directly. Files next to this one:
#   .env                site settings for Compose itself (no secrets; staging.sh init writes it)
#   secrets/*.env       one file per service, mode 600, git-ignored (staging.sh init writes them)
#   traefik/routes.yml  the public routes (a fixed file: Traefik never gets the Docker socket)
#   compose.local.yaml  a proof run on this machine (self-signed certificate, 127.0.0.1)
#   compose.acme.yaml   Let's Encrypt certificates on the VM (added in P1-T8b, with the DNS)
#   generated/client-keys/  the public halves of the signing keys (staging.sh keys; no secrets)
#   compose.monitoring.yaml  metrics and e-mail alerts (P1-T9a; staging.sh monitoring-init)
# Each container gets only the secrets it uses: the web app never sees Keycloak's admin
# credential, each worker only its own narrow Keycloak account (P1-T5f). They sign in to
# Keycloak with a private key of their own (P1-T8d2), kept in a volume on this server only.
name: indiehr-staging

x-logging: &logging
  # The host's journald keeps 180 days (CERT-In; set up with the VM in P1-T8b).
  driver: ${IHR_LOG_DRIVER:-journald}
  options:
    tag: "indiehr/{{.Name}}"
    labels: com.docker.compose.service

x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  restart: unless-stopped
  logging: *logging

x-app: &app
  <<: *hardening
  image: ${IHR_BACKEND_IMAGE:?set IHR_BACKEND_IMAGE}
  env_file:
    - secrets/app.env
  environment: &app-env
    DJANGO_SETTINGS_MODULE: ihr_platform.settings.deployment
    IHR_ENVIRONMENT: ${IHR_ENVIRONMENT:-staging}
    IHR_TENANT_DOMAIN_SUFFIX: ${IHR_TENANT_DOMAIN_SUFFIX:?}
    IHR_KEYCLOAK_PUBLIC_URL: https://auth.${IHR_TENANT_DOMAIN_SUFFIX}
    IHR_KEYCLOAK_URL: http://keycloak:8080
    IHR_CONSOLE_URL: https://console.${IHR_TENANT_DOMAIN_SUFFIX}
    IHR_BACKCHANNEL_LOGOUT_URL: http://backend:9000/api/ihr/backchannel-logout/
    # Every hospital, the console, and the two internal names (health checks, back-channel)
    DJANGO_ALLOWED_HOSTS: '[".${IHR_TENANT_DOMAIN_SUFFIX}", "localhost", "backend"]'
    # No terminology server until P1-T10: never CARE's default third party over plain HTTP
    SNOWSTORM_DEPLOYMENT_URL: http://127.0.0.1:9/fhir
    GUNICORN_WORKERS: ${IHR_GUNICORN_WORKERS:-2}
  # internal: database and Redis; edge: Keycloak, and the way out (S3, mail)
  networks: [internal, edge]
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  traefik:
    <<: *hardening
    image: traefik:v3.7.17@sha256:${IHR_TRAEFIK_DIGEST:?}
    # Not root, no capabilities, no Docker socket: it listens on high ports inside the
    # container and reads its routes from a read-only file.
    user: "65534:65534"
    command:
      - --entrypoints.web.address=:8000
      - --entrypoints.web.http.redirections.entrypoint.to=:443
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:8443
      - --entrypoints.websecure.http.tls=true
      # Uploads of up to 100 MB from slow hospital links (P1-T8b3): Traefik's 60 s default for
      # reading a whole request would cut them off
      - --entrypoints.websecure.transport.respondingTimeouts.readTimeout=15m
      # Look-alike header names (X.Forwarded.For, X_Real_Ip) are removed, not passed on (P1-T8d1)
      - --entrypoints.web.http.aliasHeadersStrategy=delete
      - --entrypoints.websecure.http.aliasHeadersStrategy=delete
      - --entrypoints.ping.address=:8082
      - --ping.entrypoint=ping
      # Metrics for Prometheus (P1-T9a) on their own port, served only by the "metrics" router
      # in routes.yml, which answers Prometheus's fixed address alone (never a public port)
      - --entrypoints.metrics.address=:8083
      - --metrics.prometheus=true
      - --metrics.prometheus.manualrouting=true
      - --metrics.prometheus.addRoutersLabels=true
      - --providers.file.filename=/etc/traefik/routes.yml
      - --api.dashboard=false
      # Access log without paths or query strings: setup links and searches carry secrets
      # and patient details, and these logs are kept 180 days.
      - --accesslog=true
      - --accesslog.format=json
      - --accesslog.fields.defaultmode=keep
      - --accesslog.fields.names.RequestPath=drop
      - --accesslog.fields.names.ClientUsername=drop
      - --accesslog.fields.headers.defaultmode=drop
      - --log.level=INFO
      - --global.checknewversion=false
      - --global.sendanonymoususage=false
    environment:
      IHR_TENANT_DOMAIN_SUFFIX: ${IHR_TENANT_DOMAIN_SUFFIX:?}
      IHR_SUFFIX_RE: ${IHR_SUFFIX_RE:?}
      # The only address allowed to read Traefik's metrics (routes.yml; compose.monitoring.yaml)
      IHR_PROMETHEUS_IP: ${IHR_PROMETHEUS_IP:-10.203.0.70}
    ports:
      - "${IHR_BIND:-0.0.0.0}:${IHR_HTTP_PORT:-80}:8000"
      - "${IHR_BIND:-0.0.0.0}:${IHR_HTTPS_PORT:-443}:8443"
    volumes:
      - ./traefik/routes.yml:/etc/traefik/routes.yml:ro
    # kcproxy: Traefik -> Keycloak only (Keycloak trusts forwarded headers from that range alone).
    # monitoring (P1-T9a): Prometheus reads the metrics port, and the probes reach the public
    # addresses by these names, through Traefik itself (port 8443) with its real certificate.
    networks:
      edge: {}
      kcproxy: {}
      monitoring:
        aliases: ["auth.${IHR_TENANT_DOMAIN_SUFFIX:?}", "status.${IHR_TENANT_DOMAIN_SUFFIX:?}"]
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping", "--ping.entrypoint=ping", "--entrypoints.ping.address=:8082"]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 128m

  db:
    <<: *hardening
    # Our build of the official postgres:18.6-alpine image with pgBackRest (P1-T8c,
    # deploy/docker/postgres.Dockerfile). Runs as postgres (70) from the start: no root
    # entrypoint, no capabilities.
    image: ${IHR_POSTGRES_IMAGE:?set IHR_POSTGRES_IMAGE}
    user: "70:70"
    env_file:
      - secrets/db.env
    environment:
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command:
      - postgres
      - -c
      - shared_buffers=${IHR_PG_SHARED_BUFFERS:-512MB}
      - -c
      - max_connections=100
      # No query values in the logs (P1-T9a). Django binds parameters on the client side, so a
      # logged statement carries literal values (names and phone numbers in searches); an
      # error's DETAIL line carries the duplicate key's value. So: no slow-statement logging,
      # never the statement behind an error, and errors in their short form only. Slow queries
      # are found through statistics instead (P1-T9b), never through the log.
      - -c
      - log_min_duration_statement=-1
      - -c
      - log_min_error_statement=panic
      - -c
      - log_error_verbosity=terse
      - -c
      - password_encryption=scram-sha-256
      # WAL archiving for backups (P1-T8c, compose.backup.yaml): on when backups are set up.
      # Finished WAL files go to a spool; the backup service pushes them off the server.
      - -c
      - archive_mode=${IHR_PG_ARCHIVE_MODE:-off}
      - -c
      - archive_command=/usr/local/bin/ihr-pgbackrest-spool %p %f
      - -c
      - archive_timeout=60
    volumes:
      # Postgres 18+ keeps its data under /var/lib/postgresql (ADR-003 rule 5)
      - pgdata:/var/lib/postgresql
      - ./initdb:/docker-entrypoint-initdb.d:ro
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: ${IHR_PG_MEMORY:-1536m}
    shm_size: 256m

  redis:
    <<: *hardening
    image: redis:8.10.3-alpine@sha256:${IHR_REDIS_DIGEST:?}
    cap_add: ["CHOWN", "SETGID", "SETUID"]
    env_file:
      - secrets/redis.env
    # Staff sessions live here (ADR-009): saved to disk, and never evicted to make room;
    # a full Redis refuses writes instead of signing people out.
    command:
      - sh
      - -c
      # The password reaches Redis on standard input ("-"), never in the process list. The
      # image's entrypoint still runs (the data folder is owned by the redis user), and Redis
      # ends up as process 1, so a stop lets it write its last changes to disk.
      # With monitoring (P1-T9a) a second, read-only user for the exporter: INFO, PING and the
      # length of the Celery queue; no other key and no CONFIG (it would show the password).
      # Redis gets only the SHA-256 of its password (secrets/redis.env).
      - |
        exec docker-entrypoint.sh redis-server - --appendonly yes --appendfsync everysec --maxmemory ${IHR_REDIS_MAXMEMORY:-256mb} --maxmemory-policy noeviction <<CONF
        requirepass "$$REDIS_PASSWORD"
        $${IHR_REDIS_MONITOR_SHA256:+user ihr-monitor on #$$IHR_REDIS_MONITOR_SHA256 resetkeys ~celery resetchannels -@all +ping +info +select +type +llen +memory|usage}
        CONF
    volumes:
      - redisdata:/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 384m

  # One-shot: schema changes, the platform's own addresses, roles and code lists in every
  # hospital. The web app and workers start only after it has finished without error.
  migrate:
    <<: *app
    restart: "no"
    command:
      - bash
      - -c
      - >-
        python manage.py migrate --noinput
        && python manage.py ihr_create_tenant --public --domain localhost
        --domain console.${IHR_TENANT_DOMAIN_SUFFIX} --domain backend
        && python manage.py all_tenants_command --no-public sync_permissions_roles
        && python manage.py all_tenants_command --no-public sync_valueset
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      disable: true

  # One-off commands (scripts/staging.sh manage, and the Keycloak set-up). Never logged: the
  # Keycloak set-up holds the bootstrap credential, and the journal is kept 180 days.
  admin:
    <<: *app
    profiles: ["admin"]
    restart: "no"
    logging:
      driver: none
    # The public keys the sync writes to Keycloak's clients (P1-T8d2); never a private key
    volumes:
      - ./generated/client-keys:/run/ihr-jwks:ro
    healthcheck:
      disable: true

  # One-off key tool (P1-T8d2; scripts/staging.sh keys): makes, lists, switches and deletes the
  # keys the web app and the two workers sign their Keycloak sign-ins with. One volume per key
  # holder, on this server only: never on the deploying machine, never backed up (owner,
  # 11-11-2026). A lost key is replaced by a new one, enrolled with the bootstrap credential.
  # No network and no logs: it prints only kids, ages and public keys.
  keytool:
    <<: *hardening
    image: ${IHR_BACKEND_IMAGE:?set IHR_BACKEND_IMAGE}
    profiles: ["keys"]
    restart: "no"
    network_mode: none
    logging:
      driver: none
    # Root only to hand a new, empty volume (Docker makes it root's) to the app user; the tool
    # itself runs as that user, so the keys are the app user's alone (600, in a 700 folder).
    # Mounted under /run/ihr-keytool, not /run/ihr-keys: the image makes that one the app
    # user's (mode 700), and root here has no right to look inside other users' folders.
    user: root
    cap_add: ["CHOWN", "SETUID", "SETGID"]
    entrypoint:
      - bash
      - -c
      - |
        set -e
        for d in /run/ihr-keytool/backend /run/ihr-keytool/onboarding /run/ihr-keytool/staff; do
          if [ "$$(stat -c %u "$$d")" = 0 ]; then chmod 700 "$$d"; chown django:django "$$d"; fi
        done
        exec setpriv --reuid=django --regid=django --clear-groups python -m ihr_platform.client_keys "$$@"
      - keytool
    volumes:
      - clientkey-backend:/run/ihr-keytool/backend
      - clientkey-onboarding:/run/ihr-keytool/onboarding
      - clientkey-staff:/run/ihr-keytool/staff
    healthcheck:
      disable: true

  backend:
    <<: *app
    env_file:
      - secrets/app.env
      # Read-only key of the audit fingerprint bucket (P1-T6b): verify and export
      - secrets/anchor-read.env
    # Its own signing key (P1-T8d2), for every hospital's client and the console; the
    # purpose makes the server refuse to start without a usable key (settings/secure.py)
    environment:
      <<: *app-env
      IHR_CLIENT_KEY_PURPOSE: backend
    volumes:
      - clientkey-backend:/run/ihr-keys:ro
    # monitoring (P1-T9a): the health probe calls http://backend:9000/health/
    networks: [internal, edge, monitoring]
    # CARE's start.sh, without its wait scripts (they expect POSTGRES_* variables and would
    # create databases): Compose already waits for a healthy database and Redis. The access
    # log has the path only (%(U)s), never the query string.
    command:
      - bash
      - -c
      - >-
        printf api > /tmp/container-role
        && python manage.py collectstatic --noinput -v 0
        && python manage.py compilemessages -v 0
        && exec gunicorn --config python:config.gunicorn config.wsgi:application
        --bind 0.0.0.0:9000 --chdir=/app --workers "$$GUNICORN_WORKERS"
        --access-logformat '%(h)s %(t)s "%(m)s %(U)s" %(s)s %(B)s %(M)sms'
        --access-logfile - --error-logfile -
    mem_limit: ${IHR_BACKEND_MEMORY:-1g}

  celery-worker:
    <<: *app
    env_file:
      - secrets/app.env
      # The hourly audit fingerprint runs here: the add-only bucket key (P1-T6b). The web
      # app holds the read-only one; beat only schedules and needs neither.
      - secrets/anchor-write.env
    command:
      - bash
      - -c
      - printf celery-worker > /tmp/container-role && exec celery --app=config.celery_app worker --max-tasks-per-child=50 --loglevel=info --concurrency=${IHR_CELERY_CONCURRENCY:-2}
    mem_limit: ${IHR_CELERY_MEMORY:-768m}

  celery-beat:
    <<: *app
    command:
      - bash
      - -c
      - printf celery-beat > /tmp/container-role && touch /tmp/healthy && exec celery --app=config.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    mem_limit: 384m

  # The two Keycloak workers (P1-T5b/f), each with only its own narrow service account, which
  # it signs in to with its own key (P1-T8d2): no Keycloak secret in any env file.
  provisioner:
    <<: *app
    environment:
      <<: *app-env
      IHR_CLIENT_KEY_PURPOSE: onboarding
    volumes:
      - clientkey-onboarding:/run/ihr-keys:ro
      # The web app's public keys, for the client of each new hospital it creates
      - ./generated/client-keys:/run/ihr-jwks:ro
    command: ["python", "manage.py", "ihr_provision_worker", "--role", "onboarding"]
    healthcheck:
      disable: true
    mem_limit: 384m

  staff-worker:
    <<: *app
    environment:
      <<: *app-env
      IHR_CLIENT_KEY_PURPOSE: staff
    volumes:
      - clientkey-staff:/run/ihr-keys:ro
    command: ["python", "manage.py", "ihr_provision_worker", "--role", "staff"]
    healthcheck:
      disable: true
    mem_limit: 320m

  keycloak:
    <<: *hardening
    # Pre-built (deploy/docker/keycloak.Dockerfile, P1-T8d1): Postgres, health, metrics and the
    # switched-off features are fixed in the image; `start --optimized` never rebuilds
    image: ${IHR_KEYCLOAK_IMAGE:?set IHR_KEYCLOAK_IMAGE}
    command: ["start", "--optimized"]
    env_file:
      - secrets/keycloak.env
    environment:
      KC_DB_URL_HOST: db
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_POOL_MAX_SIZE: "20"
      # One server: caches stay in this process, no cluster discovery. With the default
      # (a cluster found through the database) a restart after an unclean stop reported
      # "split-brain ... should not be serving requests" for up to a minute (P1-T8b2).
      # Never run two Keycloak containers on this database with this setting.
      KC_CACHE: local
      # TLS ends at Traefik; tokens carry the public https address as issuer.
      KC_HOSTNAME: https://auth.${IHR_TENANT_DOMAIN_SUFFIX}
      # The admin console lives on the private address only (SSH tunnel to this port).
      KC_HOSTNAME_ADMIN: http://127.0.0.1:${IHR_KEYCLOAK_ADMIN_PORT:-8081}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      # Only forwarded headers arriving over kcproxy count (the client IP in login events and
      # lock-outs): only Traefik and Keycloak are on it, and Traefik drops whatever a client
      # sends in those headers. Other containers reach Keycloak over edge/internal: their
      # X-Forwarded-For is ignored.
      KC_PROXY_TRUSTED_ADDRESSES: ${IHR_PROXY_NET:-10.203.0.0/28}
      # Beyond this many waiting requests Keycloak answers 503 at once instead of piling up
      KC_HTTP_MAX_QUEUED_REQUESTS: "500"
      # Login events in the journal (180 days): failures at WARN, and at INFO the sign-ins,
      # lock-outs (USER_DISABLED_BY_TEMPORARY_LOCKOUT) and admin changes. Alerts: P1-T9.
      KC_SPI_EVENTS_LISTENER__JBOSS_LOGGING__SUCCESS_LEVEL: info
      KC_SPI_EVENTS_LISTENER__JBOSS_LOGGING__ERROR_LEVEL: warn
      KC_SPI_PASSWORD_POLICY__PASSWORD_BLACKLIST__BLACKLISTS_PATH: /opt/keycloak/data/password-blacklists
      JAVA_OPTS_KC_HEAP: "-XX:MaxRAMPercentage=60 -XX:InitialRAMPercentage=25"
    volumes:
      - ../keycloak/password-blocklist:/opt/keycloak/data/password-blacklists:ro
    networks:
      internal: {}
      edge: {}
      # Traefik calls Keycloak by this name, which exists only on kcproxy (routes.yml)
      kcproxy:
        aliases: [keycloak-proxy]
      # Prometheus reads :9000/metrics and the probe :9000/health/ready (P1-T9a): the management
      # port, never routed by Traefik
      monitoring: {}
    ports:
      - "127.0.0.1:${IHR_KEYCLOAK_ADMIN_PORT:-8081}:8080"
    depends_on:
      db:
        condition: service_healthy
    # Ready = HTTP 200 from /health/ready (all checks, incl. the database). Matching "UP" in
    # the body was wrong: one passing sub-check showed it while the whole was DOWN.
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q '^HTTP/1.[01] 200'"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 120s
    # Keycloak's own shutdown takes up to 11 s (delay + timeout); Docker's default is 10
    stop_grace_period: 30s
    mem_limit: ${IHR_KEYCLOAK_MEMORY:-1g}

  frontend:
    <<: *hardening
    image: ${IHR_FRONTEND_IMAGE:?set IHR_FRONTEND_IMAGE}
    environment:
      API_UPSTREAM: http://backend:9000
      CSP_STORAGE_ORIGIN: ${IHR_STORAGE_ORIGIN:-}
    # The repository's nginx settings win over the ones built into the image, so a web-app
    # bundle built before a settings change (e.g. path-only logs) still runs the current ones.
    volumes:
      - ../docker/frontend-nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    networks: [edge]
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 96m

networks:
  edge:
  # Traefik <-> Keycloak only (P1-T8d1); a fixed range for KC_PROXY_TRUSTED_ADDRESSES. Change
  # IHR_PROXY_NET in .env if the server already uses 10.203.0.0/28.
  kcproxy:
    internal: true
    ipam:
      config:
        - subnet: ${IHR_PROXY_NET:-10.203.0.0/28}
  internal:
    internal: true
  # Prometheus and what it reads (P1-T9a, compose.monitoring.yaml); no way out. A fixed range:
  # Prometheus has a fixed address in it (.70: Traefik's metrics answer only Prometheus, and the
  # operator's SSH tunnel reaches it), outside the part Docker hands out (.96-.127). Alertmanager
  # is not on it (its own `alerting` network). Change IHR_MONITORING_NET and the address if the
  # server already uses it.
  monitoring:
    internal: true
    ipam:
      config:
        - subnet: ${IHR_MONITORING_NET:-10.203.0.64/26}
          ip_range: ${IHR_MONITORING_DYNAMIC:-10.203.0.96/27}
  # acme-dns (compose.acme.yaml) and blackbox-exporter's DNS probe (compose.monitoring.yaml)
  # only; no way out. Keeps the internet-facing DNS server off `monitoring` (P1-T9a).
  dnsprobe:
    internal: true

volumes:
  pgdata:
  redisdata:
  # Signing keys (P1-T8d2): one per holder, never backed up (a lost one is replaced)
  clientkey-backend:
  clientkey-onboarding:
  clientkey-staff:
