# Traefik routes for the staging stack (P1-T8a). A fixed file instead of Docker labels:
# Traefik gets no Docker socket (a read-only mount does not limit the Docker API, and an
# internet-facing process holding it could take over the VM and read every container's
# secrets). Go templating fills in the hospitals' domain from the container's environment.
http:
  routers:
    # Every hospital's address: <slug>.<suffix> (slugs: ihr_platform.models.SLUG_RE)
    hospitals:
      rule: 'HostRegexp(`^[a-z][a-z0-9-]{2,30}\.{{ env "IHR_SUFFIX_RE" }}$`)'
      entryPoints: [websecure]
      service: frontend
      priority: 10
      tls: {}
    # The operator console only. The back-channel logout address, health checks and the
    # rest of the platform host stay internal (P1-T5d): Keycloak reaches them as backend:9000.
    console:
      rule: 'Host(`console.{{ env "IHR_TENANT_DOMAIN_SUFFIX" }}`) && (PathPrefix(`/ops/`) || PathPrefix(`/static/`))'
      entryPoints: [websecure]
      service: backend
      middlewares: [secure-headers]
      tls: {}
    # Sign-in pages for staff and operators only: Keycloak's admin console, the master realm
    # and its metrics never reach the public address (admin: SSH tunnel to 127.0.0.1:8081).
    auth:
      rule: 'Host(`auth.{{ env "IHR_TENANT_DOMAIN_SUFFIX" }}`) && (PathPrefix(`/realms/indiehr/`) || PathPrefix(`/realms/indiehr-ops/`))'
      entryPoints: [websecure]
      service: keycloak
      middlewares: [auth-ratelimit]
      tls: {}
    # The sign-in pages' own CSS, scripts and fonts: static and cheap, a dozen per page on a
    # cold browser, so a room of staff signing in together must not run into a limit
    auth-resources:
      rule: 'Host(`auth.{{ env "IHR_TENANT_DOMAIN_SUFFIX" }}`) && PathPrefix(`/resources/`)'
      entryPoints: [websecure]
      service: keycloak
      tls: {}
    # Per-IP limits (P1-T8d1). Sized for a hospital whose ~200 staff share one public address
    # at a shift change (about 3 submissions per sign-in: password, code, maybe a typo). They
    # protect the server's CPU (each password check is a deliberate, slow hash) and slow down
    # guessing across many usernames; guessing one account's password is stopped by Keycloak's
    # own lock-out (5 failures). Anything but GET/HEAD counts, so "post" in any case does too.
    auth-login:
      rule: 'Host(`auth.{{ env "IHR_TENANT_DOMAIN_SUFFIX" }}`) && PathRegexp(`^/realms/(indiehr|indiehr-ops)/(login-actions|protocol/openid-connect/(token|auth))`) && !Method(`GET`) && !Method(`HEAD`)'
      entryPoints: [websecure]
      service: keycloak
      middlewares: [login-inflight, login-ratelimit]
      priority: 1000
      tls: {}
    # "Forgot password" sends an e-mail: much tighter
    auth-reset:
      rule: 'Host(`auth.{{ env "IHR_TENANT_DOMAIN_SUFFIX" }}`) && PathRegexp(`^/realms/(indiehr|indiehr-ops)/login-actions/reset-credentials`) && !Method(`GET`) && !Method(`HEAD`)'
      entryPoints: [websecure]
      service: keycloak
      middlewares: [login-inflight, reset-ratelimit]
      priority: 1100
      tls: {}
    # Our own sign-in start on every hospital's address. Only the start: sign-out, the
    # callback and the session heartbeat are never limited (a refused sign-out would leave a
    # shared computer signed in). Priority between the hospitals (10) and the closed hosts
    # (20, 25): the pattern also matches console., auth. and files., which must stay closed.
    hospital-auth:
      rule: 'HostRegexp(`^[a-z][a-z0-9-]{2,30}\.{{ env "IHR_SUFFIX_RE" }}$`) && PathPrefix(`/api/ihr/auth/login/`)'
      entryPoints: [websecure]
      service: frontend
      middlewares: [hospital-auth-ratelimit]
      priority: 15
      tls: {}
    # Anything else on the console, auth and status hosts goes nowhere, and ops. (reserved for
    # operator tools, P1-T9a; today they are reached by SSH tunnel only) is closed outright.
    # "status" and "ops" match the hospitals' pattern: without this router at a higher priority
    # than the hospitals (10, 15), they would be served the web app.
    closed:
      rule: 'Host(`console.{{ env "IHR_TENANT_DOMAIN_SUFFIX" }}`) || Host(`auth.{{ env "IHR_TENANT_DOMAIN_SUFFIX" }}`) || Host(`status.{{ env "IHR_TENANT_DOMAIN_SUFFIX" }}`) || Host(`ops.{{ env "IHR_TENANT_DOMAIN_SUFFIX" }}`)'
      entryPoints: [websecure]
      service: noop@internal
      priority: 20
      tls: {}
    # The public status address for the outside uptime check (P1-T9a, UptimeRobot): Traefik's
    # own ping, "OK" or 503, at a constant cost. No data, no version, no database query per
    # request from the internet. It proves the server, its network, the certificate and Traefik
    # are up; the services behind Traefik are watched from inside (Prometheus, e-mail alerts),
    # and the dead-man switch notices when that watching itself stops.
    status:
      rule: 'Host(`status.{{ env "IHR_TENANT_DOMAIN_SUFFIX" }}`) && Path(`/healthz`)'
      entryPoints: [websecure]
      service: ping@internal
      middlewares: [status-ratelimit, status-path]
      priority: 30
      tls: {}
    # Traefik's metrics, on their own port (compose.yaml: metrics entry point, no published
    # port), for Prometheus's fixed address alone (P1-T9a)
    metrics:
      rule: 'PathPrefix(`/metrics`)'
      entryPoints: [metrics]
      service: prometheus@internal
      middlewares: [prometheus-only]
    # {{ if env "IHR_FILES_BUCKETS" }}  (P1-T8b3, compose.s3.yaml: our SeaweedFS)
    # Browsers upload and download CARE's files here with presigned URLs, and read hospital
    # pictures. Object paths of the two buckets only: no bucket-level calls (create, policy,
    # lock, listing a bucket's root) and never the fingerprint bucket. "files" is a reserved slug.
    files:
      rule: 'Host(`files.{{ env "IHR_TENANT_DOMAIN_SUFFIX" }}`) && PathRegexp(`^/({{ env "IHR_FILES_BUCKETS" }})/.+`)'
      entryPoints: [websecure]
      service: s3
      middlewares: [files-headers, files-size]
      priority: 30
      tls: {}
    files-closed:
      rule: 'Host(`files.{{ env "IHR_TENANT_DOMAIN_SUFFIX" }}`)'
      entryPoints: [websecure]
      service: noop@internal
      priority: 25
      tls: {}
    # {{ end }}
  services:
    # {{ if env "IHR_FILES_BUCKETS" }}
    s3:
      loadBalancer:
        servers: [{url: "http://s3:8333"}]
    # {{ end }}
    frontend:
      loadBalancer:
        servers: [{url: "http://frontend:8080"}]
    backend:
      loadBalancer:
        servers: [{url: "http://backend:9000"}]
    # Over kcproxy only (compose.yaml): Keycloak trusts this hop's forwarded headers
    keycloak:
      loadBalancer:
        servers: [{url: "http://keycloak-proxy:8080"}]
  middlewares:
    # Token buckets per client address (Traefik sees it directly; never X-Forwarded-For, which
    # a client could forge). Over the limit: 429 with Retry-After. Keep each burst at most
    # average x 2 s: Traefik forgets a bucket idle for 2 s (11 s for reset-ratelimit), and a
    # larger burst would then come back full. IPv6 counts per /64.
    login-ratelimit:
      rateLimit:
        average: 5
        period: 1s
        burst: 10
        sourceCriterion: {ipStrategy: {ipv6Subnet: 64}}
    reset-ratelimit:
      rateLimit:
        average: 6
        period: 1m
        burst: 1
        sourceCriterion: {ipStrategy: {ipv6Subnet: 64}}
    auth-ratelimit:
      rateLimit:
        average: 30
        period: 1s
        burst: 60
        sourceCriterion: {ipStrategy: {ipv6Subnet: 64}}
    hospital-auth-ratelimit:
      rateLimit:
        average: 5
        period: 1s
        burst: 10
        sourceCriterion: {ipStrategy: {ipv6Subnet: 64}}
    status-ratelimit:
      rateLimit:
        average: 5
        period: 1s
        burst: 10
        sourceCriterion: {ipStrategy: {ipv6Subnet: 64}}
    status-path:
      replacePath:
        path: /ping
    # The connecting address itself (no forwarded headers count): Prometheus only
    prometheus-only:
      ipAllowList:
        sourceRange: ['{{ env "IHR_PROMETHEUS_IP" }}/32']
    # At most 10 sign-in submissions of one address in progress at once (each runs a slow hash)
    login-inflight:
      inFlightReq:
        amount: 10
        sourceCriterion: {ipStrategy: {ipv6Subnet: 64}}
    # {{ if env "IHR_FILES_BUCKETS" }}
    files-headers:
      headers:
        stsSeconds: 31536000
        contentTypeNosniff: true
    # CARE's web app allows files up to 100 MB; a signed upload link itself has no size limit,
    # so the limit is enforced here (bodies over 1 MB are buffered to Traefik's temporary disk)
    files-size:
      buffering:
        maxRequestBodyBytes: 110000000
        memRequestBodyBytes: 1048576
    # {{ end }}
    secure-headers:
      headers:
        stsSeconds: 31536000
        contentTypeNosniff: true
        frameDeny: true
        referrerPolicy: strict-origin-when-cross-origin
# {{ if env "IHR_ACME_RESOLVER" }}  (Go template, read by Traefik before the YAML)
# P1-T8b2 (compose.acme.yaml): one certificate for <suffix> and *.<suffix>, used by every router
# above (they say only `tls: {}`), from the resolver set up in compose.acme.yaml.
tls:
  stores:
    default:
      defaultGeneratedCert:
        resolver: '{{ env "IHR_ACME_RESOLVER" }}'
        domain:
          main: '{{ env "IHR_TENANT_DOMAIN_SUFFIX" }}'
          sans: ['*.{{ env "IHR_TENANT_DOMAIN_SUFFIX" }}']
# {{ end }}
