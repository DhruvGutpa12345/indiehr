# Based on apps/frontend/nginx/nginx.conf (upstream CARE), adapted for IndieHR:
# non-root port 8080; OHC-specific asset hosts removed from the CSP.
server {
  listen 8080;
  root /usr/share/nginx/html;

  server_tokens off;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(self), microphone=(self)" always;
  add_header Content-Security-Policy-Report-Only "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; object-src 'self'" always;

  include mime.types;
  types {
    text/javascript js mjs;
  }

  location = /index.html {
    expires 6h;
  }

  location / {
    expires 7d;
    try_files $uri $uri/ /index.html;
  }
}
