# Reference packs (P1-T15a). The start-up one-shot applies the packs to every live hospital
# (manage.py ihr_pack_apply --all --startup); one hospital's failure never stops the fleet's
# start, so it is recorded in that hospital (a PackApply row, outcome "failed", with the error,
# or "deferred" when another job still held it after three retries) and written as one fixed
# line, "ihr-packs: hospital=<slug> outcome=failed", which this rule watches. That hospital may
# lack new code lists until the packs are applied again: look at its PackApply rows, fix the
# cause and run ihr_pack_apply --slug <slug> --operator <you>.
# Forgery (S1): only container lines (source:=container) of the services that run --startup
# (staging "migrate", dev "celery"; never the web backend, whose access log prints request
# paths anyone can choose), and only a whole line that is exactly ours, with a slug-shaped
# hospital. The label is never put into the action's command. Tests: scripts/check-logs.py
# (cases in deploy/logs/tests/alert-cases.json) and scripts/test_staging_logs.py.
groups:
  - name: reference-packs
    type: vlogs
    interval: 1m
    rules:
      # A day's window: a start in the night is still firing when warnings are mailed
      - alert: PackApplyFailed
        expr: '_time:24h source:=container service:in(migrate, celery) "ihr-packs: hospital=" | extract_regexp "^ihr-packs: hospital=(?P<hospital>[a-z][a-z0-9-]{2,30}) outcome=failed$" | filter hospital:~"^[a-z][a-z0-9-]{2,30}$" | stats by (hospital) count() as failures'
        labels:
          severity: warning
          service: packs
        annotations:
          summary: 'Reference packs failed to apply to hospital {{ $labels.hospital }} ({{ $value }} times in 24 hours)'
          action: 'Read that hospital''s PackApply rows (the error), fix the cause, then run ihr_pack_apply --slug <the hospital named above> --operator <you> (it refuses a hospital that is held or not on this build''s schema: ihr_fleet_run check first)'
