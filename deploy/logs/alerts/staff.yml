# Staff sign-in resets refused (P1-T24b review K5; plugins/ihr_platform/ihr_platform/invitations.py:
# log_outcome; design docs/reviews/p1-t24/design.md "T24b as decided"; Q-K121). Every refused or
# carried-out staff action (reset sign-in, resend or cancel an invitation) writes one fixed line:
#   "ihr-staff: hospital=<slug> request=<id|none> action=<reset_sign_in|resend_invitation|
#    cancel_invitation> outcome=<code>"
# The web backend writes the two refusals it decides itself, before anything is queued
# (request=none): reset-refused (the asker is not a hospital-wide admin) and admin-target (the
# person is a hospital-wide admin here). The staff worker writes the rest (request=<id>): protected
# (a hospital-wide admin or superuser at another hospital), not-allowed (the asker lost the role),
# try-later, done and the other problem codes. Numbers, ids and our own words only: never the
# person, the asker or the worker's text.
# StaffResetRefused: 3 or more of protected, not-allowed, admin-target or reset-refused in one
#   hour at one hospital: someone probing the protected path (attack A1), a facility admin who
#   keeps trying the reset, or an admin who needs it explained. Few are normal; a burst is not.
# What to do: as that hospital's admin, read its audit trail (/api/ihr/audit/entries/, path
#   /api/ihr/staff/...: the POSTs are recorded, refused or not) for who asked, and ask them; a
#   person who is a hospital-wide admin recovers with "Forgot password" or the platform operator.
# Forgery (as batch.yml): only container lines (source:=container) of the web backend and the
# workers that write it, and only a whole line that is exactly ours with a slug-shaped hospital.
# The backend's access log lines begin with an address, a method or a path, never with
# "ihr-staff:". A forged line can at most raise a false alert naming a slug and a number; the
# labels are never put into the action's command. Tests: scripts/check-logs.py (cases in
# deploy/logs/tests/alert-cases.json) and scripts/test_staging_logs.py.
groups:
  - name: staff-sign-in
    type: vlogs
    interval: 1m
    rules:
      - alert: StaffResetRefused
        expr: '_time:1h source:=container service:in(backend, provisioner, staff-worker) "ihr-staff: hospital=" | extract_regexp "^ihr-staff: hospital=(?P<hospital>[a-z][a-z0-9-]{2,30}) request=(?:none|[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}) action=(?:reset_sign_in|resend_invitation|cancel_invitation) outcome=(?:protected|not-allowed|admin-target|reset-refused)$" | filter hospital:~"^[a-z][a-z0-9-]{2,30}$" | stats by (hospital) count() as refusals | filter refusals:>=3'
        labels:
          severity: warning
          notify: anytime
          service: staff
        annotations:
          summary: 'Hospital {{ $labels.hospital }}: {{ $value }} refused staff sign-in resets in one hour'
          action: 'As that hospital''s admin, read its audit trail (/api/ihr/audit/entries/, the POSTs under /api/ihr/staff/) for who asked, and ask them; a hospital-wide admin who lost a sign-in uses "Forgot password" or the platform operator (the card never resets one)'
