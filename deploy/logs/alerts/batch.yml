# Batch requests (P1-T20a; plugins/ihr_platform/ihr_platform/batch.py). The web backend runs a
# sub-request of POST /api/v1/batch_requests/ only if its method and route are on the reviewed
# list the web app's own batch call sites generate (batch_allowlist.txt,
# scripts/batch-allowlist.py). Anything else refuses the whole batch, nothing runs, and the
# backend writes one fixed line per refused sub-request:
# "ihr-batch: refused hospital=<slug> reason=<code> method=<METHOD|other> route=<URL name|unresolved>"
# (reason: not_listed, bad_url, bad_method, nested or override; never a value from the request).
# A refusal is either the web app batching a route the list does not have (staff see an error
# toast; an upstream sync added a batch call site and the list was not regenerated, which the
# drift check in pre-commit and Apps CI should have caught) or someone sending batches by hand.
# Fix: read the route and method in the line; if the web app sends it, run
# scripts/batch-allowlist.py, review and release; otherwise look at who sent it (the access log
# of the same minute names the caller's address).
# Forgery (as db-roles.yml): only the web backend's container lines (source:=container), and
# only a whole line that is exactly ours with a slug-shaped hospital. Its access log lines begin
# with an address, a method or a path, never with "ihr-batch:". A forged line can at most raise
# a false alert naming a slug; the label is never put into the action's command. Tests:
# scripts/check-logs.py (cases in deploy/logs/tests/alert-cases.json) and
# scripts/test_staging_logs.py.
groups:
  - name: batch-requests
    type: vlogs
    interval: 1m
    rules:
      # An hour: one refusal is worth a look, and a probe repeats it
      - alert: BatchRequestRefused
        expr: '_time:1h source:=container service:in(backend) "ihr-batch: refused" | extract_regexp "^ihr-batch: refused hospital=(?P<hospital>[a-z][a-z0-9-]{2,30}) reason=(?P<reason>not_listed|bad_url|bad_method|nested|override) method=(?P<method>GET|POST|PUT|PATCH|DELETE|other) route=(?P<route>[A-Za-z0-9_.:-]{1,100})$" | filter hospital:~"^[a-z][a-z0-9-]{2,30}$" | stats by (hospital) count() as refusals'
        labels:
          severity: warning
          service: batch
        annotations:
          summary: 'Hospital {{ $labels.hospital }}: {{ $value }} batch sub-requests refused in the last hour (a route the batch allow-list does not have)'
          action: 'Read the backend log lines starting "ihr-batch: refused" (route and method); if the web app sends that route in a batch, run scripts/batch-allowlist.py, review the diff and release; otherwise find who sent it from the access log of the same minute'
