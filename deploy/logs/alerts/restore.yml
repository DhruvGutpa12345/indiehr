# Single-hospital restores (P1-T22b; ihr_platform/restore/engine.py, scripts/staging.sh
# hospital-restore). Two fixed lines:
#   "ihr-restore: hospital=<slug> outcome=failed step=<step>"
#     written by ihr_hospital_restore when a step fails. The hospital stays held (it answers 503
#     to everyone) until the restore is resumed (--resume, after the fix) or aborted (--abort,
#     before reconcile). It runs in a "migrate" one-off (scripts/staging.sh hospital-restore). The
#     Keycloak step runs in the unlogged admin one-off: its failure is recorded as not logged and
#     written by the logged migrate one-off that follows, success or failure (ihr_hospital_restore
#     --report-failure, and every --resume; review C9); in dev the backend or worker containers.
#   "ihr-restore: parked=<ihr_parked_<schema>_<time>> outcome=overdue"
#     written every minute by the worker (ihr_platform.report_unserved) for a parked schema kept
#     past its 7 days plus one: it holds personal data (DPDP). scripts/staging.sh
#     hospital-restore-expire drops it (owner-run, daily).
# What to do: deploy/staging/README.md, "Restoring one hospital (P1-T22b)".
# Forgery (as fleet.yml): only container lines (source:=container) of the services that write
# them (never the web backend, whose access log prints request paths anyone can choose), and only
# a whole line that is exactly ours: a slug-shaped hospital and a step name, or a parked schema's
# exact name. A forged line can at most raise a false alert: the labels are never put into the
# action's command. Tests: scripts/check-logs.py (cases in deploy/logs/tests/alert-cases.json) and
# scripts/test_staging_logs.py.
groups:
  - name: restore
    type: vlogs
    interval: 1m
    rules:
      - alert: HospitalRestoreFailed
        expr: '_time:24h source:=container service:in(migrate, backend, celery) "ihr-restore: hospital=" | extract_regexp "^ihr-restore: hospital=(?P<hospital>[a-z][a-z0-9-]{2,30}) outcome=failed step=(?P<step>[a-z]{3,12})$" | filter hospital:~"^[a-z][a-z0-9-]{2,30}$" | stats by (hospital, step) count() as failures'
        labels:
          severity: critical
          service: restore
        annotations:
          summary: 'The restore of hospital {{ $labels.hospital }} failed at step {{ $labels.step }}: it stays held (503) until it is resumed or aborted'
          action: 'deploy/staging/README.md, Restoring one hospital (P1-T22b): scripts/staging.sh hospital-restore-status says which restore and why; fix the cause, then scripts/staging.sh hospital-restore <the hospital named above> --resume, or --abort before reconcile'
      - alert: ParkedSchemaOverdue
        expr: '_time:30m source:=container service:in(celery, celery-worker) "ihr-restore: parked=" | extract_regexp "^ihr-restore: parked=(?P<schema>ihr_parked_h_[a-z0-9]{10}_[0-9]{8}T[0-9]{6}) outcome=overdue$" | filter schema:~"^ihr_parked_h_[a-z0-9]{10}_[0-9]{8}T[0-9]{6}$" | stats by (schema) count() as reports'
        labels:
          severity: warning
          service: restore
        annotations:
          summary: 'Parked schema {{ $labels.schema }} is older than 8 days: it holds personal data and should have been dropped after 7'
          action: 'scripts/staging.sh hospital-restore-expire (the owner, daily; deploy/staging/README.md, Restoring one hospital (P1-T22b))'
