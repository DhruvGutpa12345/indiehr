# IndieHR local dev override for upstream CARE (P0-T5). Used on top of
# apps/backend/docker-compose.yaml + docker-compose.local.yaml. Goals:
#  - fit a 6.7 GB machine (one celery process, no auto-reload, memory caps)
#  - localhost only: every port is bound to 127.0.0.1 (upstream binds 0.0.0.0)
#  - no external calls: the terminology server is pointed at a black hole until P1-T10
#  - tenant mode (P1-T2b): one schema per hospital in the database "ihr_dev"; each hospital at
#    http://<slug>.localhost:8080. The old single-tenant database "care" is left untouched.
# Entrypoints write /tmp/container-role like upstream's scripts (used by healthcheck.sh).
# Run via scripts/care-dev.sh, not directly.
services:
  backend:
    volumes:
      - ../../plugins:/ihr/plugins:ro
    # Audit fingerprint bucket, read-only credentials (P1-T6b; `scripts/care-dev.sh audit-anchors`);
    # CARE's own storage key (P1-T8b3, written by scripts/care-dev.sh; replaces "minioadmin")
    env_file:
      - path: ../../deploy/dev/audit-anchor-read.env
        required: false
      - path: ../../deploy/dev/s3-care.env
        required: false
    environment: &tenant-env
      # Object storage: our SeaweedFS (P1-T8b3) instead of upstream's MinIO
      BUCKET_ENDPOINT: "http://s3:8333"
      BUCKET_EXTERNAL_ENDPOINT: "http://localhost:9100"
      PYTHONPATH: "/ihr/plugins/ihr_platform"
      DJANGO_SETTINGS_MODULE: "ihr_platform.settings.local"
      DATABASE_URL: "postgres://postgres:postgres@db:5432/ihr_dev"
      SNOWSTORM_DEPLOYMENT_URL: "http://127.0.0.1:9/fhir"
      CURRENT_DOMAIN: "localhost:8080"
      # Shorter idle time-out for a click-through, e.g. IHR_SESSION_IDLE_SECONDS=120 (ADR-009)
      IHR_SESSION_IDLE_SECONDS: "${IHR_SESSION_IDLE_SECONDS:-1800}"
    entrypoint: ["bash", "-c", "printf api > /tmp/container-role && ./scripts/wait_for_db.sh && ./scripts/wait_for_redis.sh && python manage.py collectstatic --noinput -v 0 && python manage.py compilemessages -v 0 && exec python manage.py runserver 0.0.0.0:9000 --noreload"]
    mem_limit: 900m
    restart: "no"
    ports: !override
      - "127.0.0.1:9000:9000"

  celery:
    volumes:
      - ../../plugins:/ihr/plugins:ro
    # The hourly audit fingerprint job: add-only credentials (P1-T6b); CARE's storage key
    env_file:
      - path: ../../deploy/dev/audit-anchor-write.env
        required: false
      - path: ../../deploy/dev/s3-care.env
        required: false
    environment: *tenant-env
    # As staging's one-shot (P1-T18a): the shared schema only ("localhost" is the platform's own
    # address, "backend" its address inside the compose network for Keycloak's back-channel
    # logout, P1-T5d), then a check that every live hospital's schema is this build's
    # (recorded for the release gate), roles in each hospital's schema and the reference packs
    # (P1-T15a). Hospitals are never migrated here: after pulling new migrations, run
    # `scripts/care-dev.sh migrate-hospitals` (docs/LOCAL_DEV.md); until then this worker stops
    # (except for a hospital that run already tried and left held: it stays at 503).
    entrypoint: ["bash", "-c", "printf celery > /tmp/container-role && ./scripts/wait_for_db.sh && ./scripts/wait_for_redis.sh && python manage.py migrate_schemas --shared --noinput && python manage.py ihr_create_tenant --public --domain localhost --domain console.localhost --domain backend && python manage.py compilemessages -v 0 && python manage.py ihr_fleet_run check roles packs --record --startup && exec celery --workdir=/app -A config.celery_app worker -B --pool=solo --concurrency=1 --loglevel=INFO"]
    mem_limit: 700m
    restart: "no"

  db:
    mem_limit: 400m
    # No query values in the logs, as on staging (P1-T9a): never the statement behind an
    # error, errors in their short form, no slow-statement logging
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=40",
              "-c", "log_min_duration_statement=-1", "-c", "log_min_error_statement=panic",
              "-c", "log_error_verbosity=terse"]
    ports: !override
      - "127.0.0.1:5433:5432"

  redis:
    mem_limit: 100m
    ports: !override
      - "127.0.0.1:6380:6379"

  # Object storage (P1-T8b3, ADR-011): SeaweedFS in place of upstream's MinIO (an unpinned fork
  # whose community edition is archived). Upstream's service is kept out of every start.
  minio:
    profiles: ["upstream-minio"]

  # One container (deploy/s3/start.sh): master, volume server and filer on 127.0.0.1 only (their
  # APIs have no access control and sit underneath S3's locks), and the S3 gateway, the only API
  # other containers reach. If either process stops, the container stops and is restarted whole.
  s3:
    image: chrislusf/seaweedfs:4.53@sha256:ccad23e18639c8b98cee17e7100b95830a06077b56d8e5b006d6dcf8ec5e94a0
    user: "1000:1000"  # the image's "seaweed" user, who owns /data
    entrypoint: ["/bin/sh", "/etc/seaweedfs/start.sh"]
    env_file:
      - path: ../../deploy/dev/s3-gateway.env
        required: false
    environment:
      IHR_S3_PATIENT_BUCKET: patient-bucket
      IHR_S3_FACILITY_BUCKET: facility-bucket
      IHR_S3_ANCHOR_BUCKET: ihr-audit-anchors
      IHR_S3_BACKUP_BUCKET: ihr-backups
      IHR_S3_LOGS_ARCHIVE_BUCKET: ihr-log-archive
      # The nightly dumps' bucket (P1-T22a; staging only: here its identity gets a key nobody holds)
      IHR_S3_DUMPS_BUCKET: ihr-dumps
      IHR_S3_MAX_GB: "5"
    volumes:
      - s3-data:/data
      - ../../deploy/s3/start.sh:/etc/seaweedfs/start.sh:ro
      - ../../deploy/s3/s3.template.json:/etc/seaweedfs/s3.template.json:ro
    # The rendered key file and the parts' Unix sockets; the root file system is read-only
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=0700,size=16m
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    # The S3 port, same host address as upstream's MinIO had
    ports:
      - "127.0.0.1:9100:8333"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz && wget -q -O /dev/null http://127.0.0.1:8888/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: 320m
    restart: unless-stopped

volumes:
  s3-data:
