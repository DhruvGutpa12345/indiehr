# IndieHR local Keycloak (P1-T3), on top of care-local.override.yaml. Opt-in (profile
# "keycloak") because of RAM: run it through `scripts/care-dev.sh keycloak up`.
#  - browser address http://auth.localhost:8081; the CARE containers reach it as http://keycloak:8080
#  - its own database "keycloak" (owner role "keycloak") on the dev Postgres, never ihr_dev
#  - secrets come from deploy/dev/keycloak.env (git-ignored, written by care-dev.sh)
#  - the web app and each worker sign in to Keycloak with a key of their own (P1-T8d2), in a
#    volume each (scripts/care-dev.sh keycloak keys); the public halves are in
#    deploy/dev/client-keys/ (git-ignored)
# Relative paths resolve against apps/backend (the compose project directory).
services:
  # The web app signs for every hospital's client and the console with its own key. Here it
  # also runs the dev sync (care-dev.sh kc_manage), which reads the public keys.
  backend:
    volumes:
      - clientkey-backend:/run/ihr-keys:ro
      - ../../deploy/dev/client-keys:/run/ihr-jwks:ro

  # One-off key tool (P1-T8d2; scripts/care-dev.sh keycloak keys): no network, no logs. It
  # prints only kids, ages and public keys. Root, like every container of the dev image.
  keytool:
    image: care_local
    profiles: ["keys"]
    network_mode: none
    logging:
      driver: none
    environment:
      PYTHONPATH: "/ihr/plugins/ihr_platform"
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ../../plugins:/ihr/plugins:ro
      - clientkey-backend:/run/ihr-keytool/backend
      - clientkey-onboarding:/run/ihr-keytool/onboarding
      - clientkey-staff:/run/ihr-keytool/staff
    # Docker makes a new volume 755: the keys' folder is the owner's alone
    entrypoint: ["bash", "-c", "chmod 700 /run/ihr-keytool/* && exec python -m ihr_platform.client_keys \"$$@\"", "keytool"]
    healthcheck:
      disable: true
    restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2@sha256:723b1d6e254c0fc96d5cffec860c7e0744d6a3277822b865bb538cf891575e41
    profiles: ["keycloak"]
    command: ["start-dev"]
    env_file:
      - path: ../../deploy/dev/keycloak.env
        required: true
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: db
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      # Dev Postgres allows 40 connections; Keycloak's default pool is 100.
      KC_DB_POOL_INITIAL_SIZE: "1"
      KC_DB_POOL_MIN_SIZE: "1"
      KC_DB_POOL_MAX_SIZE: "8"
      # Tokens carry the browser address as issuer; back-channel calls may use keycloak:8080.
      KC_HOSTNAME: http://auth.localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      KC_FEATURES_DISABLED: device-flow,ciba,impersonation,kerberos
      KC_SPI_PASSWORD_POLICY__PASSWORD_BLACKLIST__BLACKLISTS_PATH: /opt/keycloak/data/password-blacklists
      JAVA_OPTS_KC_HEAP: "-XX:MaxRAMPercentage=50 -XX:InitialRAMPercentage=20 -XX:MinHeapFreeRatio=10 -XX:MaxHeapFreeRatio=30"
    volumes:
      - ../../deploy/keycloak/password-blocklist:/opt/keycloak/data/password-blacklists:ro
    depends_on:
      db:
        condition: service_healthy
    # No curl in the image; bash's /dev/tcp reads the readiness endpoint on the management port.
    # Ready means HTTP 200 (every check passed), not just an "UP" somewhere in the body.
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q '^HTTP/1.[01] 200'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    mem_limit: 1g
    restart: "no"
    ports:
      - "127.0.0.1:8081:8080"
      - "127.0.0.1:9002:9000"

  # Mailpit (P1-T5c): catches every e-mail Keycloak sends in development (setup links).
  # Inbox http://127.0.0.1:8025; SMTP only inside the compose network (mailpit:1025).
  mailpit:
    image: axllent/mailpit:v1.33.0@sha256:9b3a463be15354c0f0eba91697d80e3e0d8a5623ef0e627cacc836bc17fd5231
    profiles: ["keycloak"]
    environment:
      MP_MAX_MESSAGES: "500"
      MP_SMTP_AUTH_ALLOW_INSECURE: "false"
      MP_DISABLE_VERSION_CHECK: "true"  # no calls home to GitHub
    mem_limit: 64m
    restart: "no"
    ports:
      - "127.0.0.1:8025:8025"

  # The onboarding worker (P1-T5b, narrowed in P1-T5f): runs the hospital operations operators
  # queue in the console, with only the "ihr-onboarding" service account of the hospitals'
  # realm, which it signs in to with its own key (P1-T8d2). Neither worker holds the bootstrap
  # admin credential or any Keycloak secret.
  provisioner:
    image: care_local
    profiles: ["keycloak"]
    env_file:
      - path: ./docker/.local.env
        required: true
    environment: &worker-env
      PYTHONPATH: "/ihr/plugins/ihr_platform"
      DJANGO_SETTINGS_MODULE: "ihr_platform.settings.local"
      DATABASE_URL: "postgres://postgres:postgres@db:5432/ihr_dev"
      SNOWSTORM_DEPLOYMENT_URL: "http://127.0.0.1:9/fhir"
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      # Read-only: the web app and worker can write the shared source folder, and nothing
      # they write may run in a process that holds a Keycloak admin credential.
      - .:/app:ro
      - ../../plugins:/ihr/plugins:ro
      - clientkey-onboarding:/run/ihr-keys:ro
      # The web app's public keys, for the client of each new hospital it creates
      - ../../deploy/dev/client-keys:/run/ihr-jwks:ro
    entrypoint: ["bash", "-c", "./scripts/wait_for_db.sh && exec python manage.py ihr_provision_worker --role onboarding"]
    depends_on: &worker-deps
      db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      disable: true  # CARE's image check is for the API and worker roles
    mem_limit: 400m
    restart: unless-stopped

  # The staff worker (P1-T5f): invitations, admins' resets/resends/cancels and expiry, with
  # only the "ihr-staff-worker" account (accounts, memberships, e-mail; no realm settings).
  staff-worker:
    image: care_local
    profiles: ["keycloak"]
    env_file:
      - path: ./docker/.local.env
        required: true
    environment: *worker-env
    volumes:
      - .:/app:ro
      - ../../plugins:/ihr/plugins:ro
      - clientkey-staff:/run/ihr-keys:ro
    entrypoint: ["bash", "-c", "./scripts/wait_for_db.sh && exec python manage.py ihr_provision_worker --role staff"]
    depends_on: *worker-deps
    healthcheck:
      disable: true
    mem_limit: 300m
    restart: unless-stopped

volumes:
  # Signing keys (P1-T8d2): one per holder; `docker compose down -v` (or losing them) only means
  # new ones at the next `scripts/care-dev.sh keycloak up`
  clientkey-backend:
  clientkey-onboarding:
  clientkey-staff:
