# Versions pinned 2026-11-03 (see docs/VERSIONS.md). Update with: pre-commit autoupdate
# Upstream CARE code is never reformatted by our hooks (ADR-006).
exclude: '^apps/(backend|frontend)/'
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.md$'
      - id: end-of-file-fixer
      - id: check-yaml
        # syntax-only: allows Docker Compose tags such as !override
        args: ['--unsafe']
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=1024']
      - id: detect-private-key
      - id: mixed-line-ending
        args: ['--fix=lf']
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
      - id: shellcheck
  # Our own Python (plugins/), linted with CARE's ruff config so both codebases share one style.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.8
    hooks:
      - id: ruff-check
        files: ^plugins/
        args: ["--config", "plugins/ruff.toml"]
      - id: ruff-format
        files: ^plugins/
        args: ["--config", "plugins/ruff.toml"]
  # Our translations (P1-T7c): same placeholders and tags as English, merge rules tested.
  - repo: local
    hooks:
      - id: locale-overlay
        name: translations match English (placeholders, tags)
        entry: python3 scripts/merge-locale.py --check
        language: system
        files: ^(deploy/locale/|scripts/(merge-locale|test_merge_locale)\.py$)
        pass_filenames: false
      - id: locale-overlay-tests
        name: merge-locale tests
        entry: python3 -m unittest scripts/test_merge_locale.py
        language: system
        files: ^scripts/(merge-locale|test_merge_locale)\.py$
        pass_filenames: false
