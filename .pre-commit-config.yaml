# Versions pinned 2026-11-03 (see docs/VERSIONS.md). Update with: pre-commit autoupdate
# Upstream CARE code is never reformatted by our hooks (ADR-006).
exclude: '^apps/(backend|frontend)/'
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.md$'
      - id: end-of-file-fixer
      - id: check-yaml
        # syntax-only: allows Docker Compose tags such as !override
        args: ['--unsafe']
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=1024']
      - id: detect-private-key
      - id: mixed-line-ending
        args: ['--fix=lf']
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
      - id: shellcheck
  # Our own Python (plugins/), linted with CARE's ruff config so both codebases share one style.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.8
    hooks:
      - id: ruff-check
        files: ^plugins/
        args: ["--config", "plugins/ruff.toml"]
      - id: ruff-format
        files: ^plugins/
        args: ["--config", "plugins/ruff.toml"]
  # Our translations (P1-T7c): same placeholders and tags as English, merge rules tested.
  - repo: local
    hooks:
      - id: locale-overlay
        name: translations match English (placeholders, tags)
        entry: python3 scripts/merge-locale.py --check
        language: system
        files: ^(deploy/locale/|scripts/(merge-locale|test_merge_locale)\.py$)
        pass_filenames: false
      - id: locale-overlay-tests
        name: merge-locale tests
        entry: python3 -m unittest scripts/test_merge_locale.py
        language: system
        files: ^scripts/(merge-locale|test_merge_locale)\.py$
        pass_filenames: false
  # Reference packs (P1-T15a): a released version file is never changed, only added
  - repo: local
    hooks:
      - id: pack-versions-immutable
        name: released reference pack versions are unchanged
        entry: scripts/check-pack-versions.sh
        language: system
        # pre-commit never lists deleted files, so it runs on every commit (cheap: one git diff)
        always_run: true
        pass_filenames: false
      # The check itself, in throwaway repositories (CI also runs it with --base, ci.yml)
      # The upstream drift report's thresholds (P1-T17; run weekly by upstream-drift.yml)
      - id: upstream-drift-tests
        name: upstream drift check tests
        entry: python3 -m unittest scripts/test_check_upstream_drift.py
        language: system
        files: ^scripts/(check-upstream-drift\.sh|test_check_upstream_drift\.py)$
        pass_filenames: false
      - id: pack-versions-tests
        name: pack version check tests
        entry: python3 -m unittest scripts/test_check_pack_versions.py
        language: system
        files: ^(scripts/(check-pack-versions\.sh|test_check_pack_versions\.py)|\.github/workflows/ci\.yml)$
        pass_filenames: false
  # India date style in the web app (P1-T7b): every date display pattern is mapped or allowed.
  - repo: local
    hooks:
      - id: india-date-formats
        name: web app date formats are in the India date tables
        entry: python3 scripts/check-date-formats.py
        language: system
        files: ^(apps/frontend/src/|scripts/(check-date-formats|test_check_date_formats)\.py$)
        pass_filenames: false
      - id: india-date-formats-tests
        name: check-date-formats tests
        entry: python3 -m unittest scripts/test_check_date_formats.py
        language: system
        files: ^scripts/(check-date-formats|test_check_date_formats)\.py$
        pass_filenames: false
  # Browser storage (P1-T1d): every localStorage/sessionStorage key in the web app is allowed to
  # remain after sign-out (apps/frontend/tests-ihr/storage-keys.json) or cleared by
  # clearStaffStorage. Always runs: apps/ is excluded above, and the check is cheap (<1 s).
  # The CI dev-secret mask fails closed on new shapes; its tests run here too.
  - repo: local
    hooks:
      - id: browser-storage-keys
        name: web app storage keys are classified
        entry: python3 scripts/check-storage-keys.py
        language: system
        always_run: true
        pass_filenames: false
      - id: browser-storage-keys-tests
        name: check-storage-keys tests
        entry: python3 -m unittest scripts/test_check_storage_keys.py
        language: system
        files: ^scripts/(check-storage-keys|test_check_storage_keys)\.py$
        pass_filenames: false
      - id: ci-mask-dev-secrets-tests
        name: CI dev-secret mask tests
        entry: python3 -m unittest scripts/test_ci_mask_dev_secrets.py
        language: system
        files: ^scripts/(ci-mask-dev-secrets|test_ci_mask_dev_secrets)\.py$
        pass_filenames: false
  # Host kit (P1-T8b1): the bootstrap's required controls (NIC/NPL time, SSH, 180-day logs,
  # firewall) and no provider names in the kit (ADR-011).
  - repo: local
    hooks:
      - id: host-bootstrap-static
        name: host bootstrap keeps its required settings
        entry: python3 -m unittest scripts/test_bootstrap_static.py
        language: system
        files: ^(deploy/host/|scripts/(deploy|local-vm)\.sh$|scripts/test_bootstrap_static\.py$)
        pass_filenames: false
      # Backups (P1-T8c): database offline and unprivileged, encrypted repository, drill
      - id: staging-backup-static
        name: backups keep their required settings
        entry: python -m unittest scripts/test_staging_backup.py
        language: python
        additional_dependencies: ["pyyaml==6.0.3"]
        files: ^(deploy/docker/postgres\.Dockerfile$|deploy/docker/backup/|deploy/staging/|scripts/staging\.sh$|scripts/test_staging_backup\.py$)
        pass_filenames: false
      # Keycloak (P1-T8d1): pre-built image, single node, trusted proxy, per-IP sign-in limits
      - id: staging-keycloak-static
        name: Keycloak keeps its production settings
        entry: python -m unittest scripts/test_staging_keycloak.py
        language: python
        additional_dependencies: ["pyyaml==6.0.3"]
        files: ^(deploy/docker/keycloak\.Dockerfile$|deploy/staging/|deploy/dev/keycloak|plugins/ihr_platform/ihr_platform/keycloak/realm\.py$|\.github/workflows/apps\.yml$|scripts/test_staging_keycloak\.py$)
        pass_filenames: false
      # Signing keys (P1-T8d2): one volume per holder, offline key tool, rotation order
      - id: staging-keys-static
        name: client signing keys keep their required settings
        entry: python -m unittest scripts/test_staging_keys.py
        language: python
        additional_dependencies: ["pyyaml==6.0.3"]
        files: ^(deploy/staging/|deploy/dev/(keycloak|care-local)|deploy/keycloak/|scripts/(staging|care-dev|deploy|client-keys)\.sh$|scripts/test_staging_keys\.py$|\.gitignore$)
        pass_filenames: false
      # Mail (P1-T8b4): token never on a command line, stand-in like the real service
      - id: staging-mail-static
        name: mail settings keep their required shape
        entry: python -m unittest scripts/test_staging_mail.py
        language: python
        additional_dependencies: ["pyyaml==6.0.3"]
        files: ^(deploy/staging/|scripts/staging\.sh$|scripts/test_staging_mail\.py$|plugins/ihr_platform/ihr_platform/settings/secure\.py$)
        pass_filenames: false
      # Object storage (P1-T8b3): SeaweedFS internals private, narrow keys, files route
      - id: staging-s3-static
        name: object storage keeps its required settings
        entry: python -m unittest scripts/test_staging_s3.py
        language: python
        additional_dependencies: ["pyyaml==6.0.3"]
        files: ^(deploy/s3/|deploy/staging/|deploy/dev/care-local|scripts/(staging|care-dev|deploy)\.sh$|scripts/test_staging_s3\.py$|plugins/ihr_platform/ihr_platform/models\.py$)
        pass_filenames: false
      # Wildcard certificate (P1-T8b2): acme-dns hardening, resolver settings, pinned images
      - id: staging-acme-static
        name: certificate stack keeps its required settings
        entry: python -m unittest scripts/test_staging_acme.py
        language: python
        additional_dependencies: ["pyyaml==6.0.3"]
        files: ^(deploy/staging/|deploy/docker/acme-dns|scripts/(staging|deploy)\.sh$|scripts/test_staging_acme\.py$)
        pass_filenames: false
      # Metrics and e-mail alerts (P1-T9a): hardened services, no Docker socket, narrow exporter
      # users, Traefik's metrics and status routes, no query values in Postgres's logs
      - id: staging-monitoring-static
        name: monitoring keeps its required settings
        entry: python -m unittest scripts/test_staging_monitoring.py
        language: python
        additional_dependencies: ["pyyaml==6.0.3"]
        files: ^(deploy/staging/|deploy/monitoring/|deploy/dev/care-local|scripts/(staging|deploy|check-monitoring)\.sh$|scripts/test_staging_monitoring\.py$|plugins/ihr_platform/ihr_platform/models\.py$|\.pre-commit-config\.yaml$)
        pass_filenames: false
      # The rules' unit tests and the settings, checked by the pinned Prometheus and Alertmanager
      # images themselves (promtool, amtool): needs Docker, no network
      - id: monitoring-promtool
        name: Prometheus rules, rule tests and Alertmanager settings (promtool, amtool)
        entry: scripts/check-monitoring.sh
        language: system
        files: ^(deploy/monitoring/|deploy/staging/compose\.monitoring\.yaml$|scripts/(staging|check-monitoring)\.sh$)
        pass_filenames: false
      # Logs (P1-T9b): hardened log services, the store reachable by the pipeline alone, deleting
      # behind the operator's key, journal read-only, redaction before the output, alert labels
      - id: staging-logs-static
        name: log collection keeps its required settings
        entry: python -m unittest scripts/test_staging_logs.py
        language: python
        additional_dependencies: ["pyyaml==6.0.3"]
        files: ^(deploy/logs/|deploy/s3/|deploy/staging/|deploy/host/bootstrap\.sh$|scripts/(staging|deploy)\.sh$|scripts/test_staging_logs\.py$|plugins/ihr_platform/ihr_platform/settings/deployment\.py$|\.pre-commit-config\.yaml$)
        pass_filenames: false
      # Releases and rollbacks (P1-T18b): the release log, the rollback's decision, the order of
      # the window's steps, what deploy.sh keeps and never sends
      - id: release-scripts
        name: releases and rollbacks keep their rules
        entry: python -m unittest scripts/test_release_scripts.py
        language: python
        files: ^(scripts/(staging|deploy)\.sh$|scripts/release_log\.py$|scripts/test_release_scripts\.py$|\.gitignore$)
        pass_filenames: false
      # Split database roles on staging (P1-T19b): the secrets, who holds the owner's address, each
      # container's pre-start role check, the re-assertion at every up, the move under a full stop,
      # the restore drill as the owner, deploy.sh's refusals, required as the deployment default
      - id: staging-db-roles-static
        name: the split database roles keep their rules
        entry: python -m unittest scripts/test_staging_db_roles.py
        language: python
        additional_dependencies: ["pyyaml==6.0.3"]
        files: ^(deploy/staging/|deploy/logs/alerts/db-roles\.yml$|scripts/(staging|deploy)\.sh$|scripts/test_staging_db_roles\.py$|plugins/ihr_platform/ihr_platform/(db_roles\.py|settings/(deployment|secure)\.py)$|\.gitignore$)
        pass_filenames: false
      # Dashboards (P1-T9d): Grafana alone with Prometheus and the read-only log door, hardened,
      # one host name, nothing called out; dashboards current with their generator
      - id: staging-dashboards-static
        name: dashboards keep their required settings
        entry: python -m unittest scripts/test_staging_dashboards.py
        language: python
        additional_dependencies: ["pyyaml==6.0.3"]
        files: ^(deploy/grafana/|deploy/docker/grafana\.Dockerfile$|deploy/staging/|deploy/logs/|deploy/monitoring/|scripts/(staging|deploy|check-dashboards)\.(sh|py)$|scripts/test_staging_dashboards\.py$|\.pre-commit-config\.yaml$)
        pass_filenames: false
      # The redaction cases through the pinned Fluent Bit, the store and the log alerts through
      # the pinned VictoriaLogs and vmalert: needs Docker, nothing leaves this machine (~30 s)
      - id: logs-check
        name: log redaction and log alerts (Fluent Bit, VictoriaLogs, vmalert)
        entry: scripts/check-logs.py
        language: system
        files: ^(deploy/logs/|deploy/staging/compose\.logs\.yaml$|scripts/check-logs\.py$)
        pass_filenames: false
      # The daily locked log archive (P1-T9c): the archiver and erasure against a fake store and
      # bucket (the backend image's cryptography version)
      - id: logs-archive-tests
        name: log archive (export, encryption, chain, revisions)
        entry: python -m unittest scripts/test_logs_archive.py
        language: python
        additional_dependencies: ["cryptography==50.0.2"]
        files: ^(deploy/logs/archive/|scripts/test_logs_archive\.py$)
        pass_filenames: false
