name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Repo checks (pre-commit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the released pack check below reads the commit before the push
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install pre-commit
        run: pip install pre-commit==4.7.0
      - name: Run all hooks
        run: pre-commit run --all-files --show-diff-on-failure
      # The pre-commit hook sees only staged changes (none here) and can be skipped: compare
      # every released reference pack version with the commit before this push (or the pull
      # request's base). No base (a new branch, a manual run): nothing to compare.
      - name: Released reference pack versions are unchanged (P1-T15a)
        # against every manifest in the history (full history is fetched above), so a version
        # deleted in one push and rebuilt in the next is still refused
        run: scripts/check-pack-versions.sh --history

  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks over every commit (reviewed false positives in .gitleaksignore)
        run: |
          docker run --rm -v "$PWD":/repo -w /repo --entrypoint sh \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            -c 'git config --global --add safe.directory /repo && gitleaks git --redact --no-banner --no-color .'
