name: Apps CI

# Lints, tests and scans the CARE backend/frontend (apps/) and our plugins.
# Heavy jobs run only when their files change, plus weekly and on demand,
# to stay within the private-repo Actions minute budget.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 21 * * 0" # Sundays 03:00 IST
  workflow_dispatch:
    inputs:
      postgres_image:
        description: "Run backend tests on this Postgres image instead of upstream's (e.g. postgres:18.6-alpine)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: apps-ci-${{ github.ref }}
  # Never cancel runs on main, so every commit there gets a verdict
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-24.04
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
      isolation: ${{ steps.filter.outputs.isolation }}
      keycloak: ${{ steps.filter.outputs.keycloak }}
      browser: ${{ steps.filter.outputs.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no step pushes or calls the API with it
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            backend:
              - 'apps/backend/**'
              - 'plugins/**'
              - 'deploy/docker/backend.Dockerfile'
              - 'deploy/ci/**'
              - 'scripts/isolation-mutation.sh'
              - '.github/workflows/apps.yml'
            frontend:
              - 'apps/frontend/**'
              - 'plugins/**'
              - 'deploy/docker/frontend*'
              - 'deploy/frontend*'
              - 'deploy/locale/**'
              - 'scripts/merge-locale.py'
              - 'scripts/check-bundle-egress.sh'
              - 'scripts/*check-storage-keys.py'
              - '.github/workflows/apps.yml'
            # Mutation runs cost one full-stack job per row (26 today: scripts/isolation-mutation.sh
            # list), so they run only when an isolation control or its tests change
            isolation:
              - 'plugins/ihr_platform/**'
              - 'scripts/isolation-mutation.sh'
              - 'apps/backend/config/patient_otp_token.py'
              - 'apps/backend/care/emr/signals/patient/base.py'
              - 'apps/backend/care/emr/models/valueset.py'
              - 'apps/backend/care/emr/models/patient.py'
              - 'apps/backend/care/emr/utils/file_manager.py'
              - 'apps/backend/care/utils/file_uploads/cover_image.py'
              - 'apps/backend/config/celery_app.py'
              - 'apps/backend/config/patient_otp_authentication.py'
              - 'apps/backend/config/settings/**'
              - 'apps/backend/care/emr/resources/base.py'
              - 'apps/backend/care/emr/utils/reset_password.py'
              - 'deploy/ci/**'
              - '.github/workflows/apps.yml'
              - 'upstream.lock'
            keycloak:
              - 'plugins/ihr_platform/ihr_platform/keycloak/**'
              - 'plugins/ihr_platform/ihr_identity/tokens.py'
              # Signed-key client authentication the live tests exercise (P1-T8d2)
              - 'plugins/ihr_platform/ihr_platform/client_keys.py'
              - 'plugins/ihr_platform/ihr_identity/client_auth.py'
              - 'plugins/ihr_platform/ihr_identity/oidc.py'
              - 'deploy/keycloak/**'
              - 'deploy/dev/keycloak*'
              - 'scripts/keycloak*'
              - '.github/workflows/apps.yml'
            # Browser specs (P1-T1d): the frontend and Keycloak areas, plus everything the dev
            # stack they run on is built from
            browser:
              - 'apps/frontend/**'
              - 'apps/backend/**'
              - 'plugins/**'
              - 'deploy/docker/frontend*'
              - 'deploy/frontend*'
              - 'deploy/locale/**'
              - 'deploy/keycloak/**'
              - 'deploy/dev/**'
              - 'deploy/s3/**'
              - 'scripts/merge-locale.py'
              - 'scripts/check-bundle-egress.sh'
              - 'scripts/keycloak*'
              - 'scripts/care-dev.sh'
              - 'scripts/client-keys.sh'
              - 'scripts/ci-mask-dev-secrets.py'
              - '.github/workflows/apps.yml'
            infra:
              - 'deploy/**'
              - 'infra/**'
              - 'scripts/**'
              - '.trivyignore.yaml'
              - '.github/workflows/**'

  backend:
    name: Backend (ruff, migrations, fixtures, tests)
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no step pushes or calls the API with it
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Ruff lint and format check (upstream config)
        run: |
          pip install ruff==0.14.8
          ruff check .
          ruff format --check .

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build dev image
        run: |
          docker buildx build \
            --file docker/dev.Dockerfile \
            --tag care_local \
            --cache-from type=gha,scope=backend \
            --cache-to type=gha,mode=max,scope=backend \
            --load .

      - name: Use a different Postgres image (manual runs only)
        if: github.event_name == 'workflow_dispatch' && inputs.postgres_image != ''
        env:
          PG_IMAGE: ${{ inputs.postgres_image }}
        run: |
          # Postgres 18+ images keep data under /var/lib/postgresql (not .../data)
          printf 'services:\n  db:\n    image: %s\n    volumes: !override\n      - pg-ci-data:/var/lib/postgresql\nvolumes:\n  pg-ci-data: {}\n' "$PG_IMAGE" > docker-compose.override.ci.yaml
          cat docker-compose.override.ci.yaml
          sed -i "s|docker_config_file := 'docker-compose.local.yaml'|docker_config_file := 'docker-compose.local.yaml' -f docker-compose.override.ci.yaml|" Makefile
          echo "Postgres image for this run: $PG_IMAGE"

      - name: Start services
        run: make up || (docker compose -f docker-compose.yaml -f docker-compose.local.yaml logs && exit 1)

      - name: Report Postgres version
        run: docker compose exec -T db psql -U postgres -tAc "select version()"

      - name: Check for missing migrations
        run: make checkmigration

      - name: Validate fixtures load
        run: make load-fixtures

      - name: Run test suite
        run: make test

      - name: Service logs on failure
        if: failure()
        run: docker compose -f docker-compose.yaml -f docker-compose.local.yaml logs --tail=200

  backend-tenant:
    name: Backend in tenant mode (CARE suite inside a tenant schema)
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/backend
    env:
      COMPOSE: docker compose -f docker-compose.yaml -f docker-compose.local.yaml -f ../../deploy/ci/tenancy.override.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no step pushes or calls the API with it

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build dev image
        run: |
          docker buildx build \
            --file docker/dev.Dockerfile \
            --tag care_local \
            --cache-from type=gha,scope=backend \
            --load .

      - name: Start services (with ihr_platform mounted)
        run: $COMPOSE up -d --wait || ($COMPOSE logs && exit 1)

      - name: CARE suite + ihr_platform tests inside a tenant schema
        run: |
          set +e
          $COMPOSE exec -T backend python manage.py test --settings=ihr_platform.settings.test --noinput -v 2 ihr_platform ihr_tenant_settings ihr_identity ihr_audit ihr_terminology ihr_roles ihr_refdata ihr_refdata_registry . > tenant-tests.log 2>&1
          status=$?
          grep -vE "\.\.\. ok$" tenant-tests.log | tail -400
          exit $status

      - name: Summary
        if: always()
        run: |
          grep -E "^Ran [0-9]+ tests|^OK|^FAILED|Tenant mode" tenant-tests.log || true
          grep -E "^(ERROR|FAIL):" tenant-tests.log | sort | uniq -c | sort -rn | head -40 || true

      - name: Service logs on failure
        if: failure()
        run: $COMPOSE logs --tail=200

  mutation-list:
    name: Isolation mutations (list)
    needs: changes
    if: needs.changes.outputs.isolation == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      names: ${{ steps.list.outputs.names }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no step pushes or calls the API with it
      - name: Every mutation target still exists
        run: scripts/isolation-mutation.sh check
      - id: list
        run: echo "names=$(scripts/isolation-mutation.sh list | jq -Rnc '[inputs]')" >> "$GITHUB_OUTPUT"

  # TENANCY_DESIGN.md §11.2 (and P1-T16a): remove one isolation or security control at a time;
  # the test that guards it must then fail. A green run here means a test has stopped guarding.
  isolation-mutation:
    name: Isolation mutation (${{ matrix.mutation }} must fail)
    needs: mutation-list
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        mutation: ${{ fromJSON(needs.mutation-list.outputs.names) }}
    defaults:
      run:
        working-directory: apps/backend
    env:
      COMPOSE: docker compose -f docker-compose.yaml -f docker-compose.local.yaml -f ../../deploy/ci/tenancy.override.yaml
      MUTATION: ${{ matrix.mutation }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no step pushes or calls the API with it

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build dev image
        run: |
          docker buildx build \
            --file docker/dev.Dockerfile \
            --tag care_local \
            --cache-from type=gha,scope=backend \
            --load .

      - name: Remove the control
        run: ../../scripts/isolation-mutation.sh apply "$MUTATION"

      - name: Start services (with ihr_platform mounted)
        run: $COMPOSE up -d --wait || ($COMPOSE logs && exit 1)

      - name: The guarding tests must fail
        run: |
          read -r -a labels <<<"$(../../scripts/isolation-mutation.sh test "$MUTATION")"
          set +e
          $COMPOSE exec -T backend python manage.py test --settings=ihr_platform.settings.test --noinput -v 2 "${labels[@]}" > mutation.log 2>&1
          status=$?
          set -e
          grep -E "^(FAIL|ERROR):|^Ran |^OK|^FAILED|Error:" mutation.log | head -40 || true
          if [ "$status" -eq 0 ]; then
            echo "::error::Mutation $MUTATION survived: the suite stayed green without this control"
            exit 1
          fi
          while read -r expect; do
            if ! grep -qE "$expect" mutation.log; then
              echo "::error::Mutation $MUTATION: no line matching '$expect'"
              tail -150 mutation.log
              exit 1
            fi
          done < <(../../scripts/isolation-mutation.sh expect "$MUTATION")
          echo "Mutation $MUTATION killed, as required."

  keycloak:
    name: Keycloak live tests
    needs: changes
    if: needs.changes.outputs.keycloak == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Same image as deploy/dev/keycloak.override.yaml (docs/VERSIONS.md)
      KEYCLOAK_IMAGE: quay.io/keycloak/keycloak:26.8.2@sha256:723b1d6e254c0fc96d5cffec860c7e0744d6a3277822b865bb538cf891575e41
      POSTGRES_IMAGE: postgres:18.6-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
      # Catches the setup e-mails (P1-T5c); same image as the dev stack
      MAILPIT_IMAGE: axllent/mailpit:v1.33.0@sha256:9b3a463be15354c0f0eba91697d80e3e0d8a5623ef0e627cacc836bc17fd5231
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no step pushes or calls the API with it

      - name: Start Postgres, Mailpit and Keycloak (throwaway secrets)
        run: |
          DB_PW="$(openssl rand -hex 16)"
          ADMIN_SECRET="$(openssl rand -hex 24)"
          echo "::add-mask::$ADMIN_SECRET"
          echo "IHR_KC_TEST_ADMIN_SECRET=$ADMIN_SECRET" >> "$GITHUB_ENV"
          docker network create kc
          docker run -d --name mailpit --network kc -p 127.0.0.1:8025:8025 \
            -e MP_DISABLE_VERSION_CHECK=true "$MAILPIT_IMAGE"
          docker run -d --name kc-db --network kc -e POSTGRES_USER=keycloak \
            -e POSTGRES_PASSWORD="$DB_PW" -e POSTGRES_DB=keycloak "$POSTGRES_IMAGE"
          docker run -d --name kc --network kc -p 127.0.0.1:8081:8080 -p 127.0.0.1:9002:9000 \
            -e KC_DB=postgres -e KC_DB_URL_HOST=kc-db -e KC_DB_URL_DATABASE=keycloak \
            -e KC_DB_USERNAME=keycloak -e KC_DB_PASSWORD="$DB_PW" \
            -e KC_HOSTNAME=http://auth.localhost:8081 -e KC_HEALTH_ENABLED=true \
            -e KC_FEATURES_DISABLED=device-flow,ciba,impersonation,kerberos \
            -e KC_SPI_PASSWORD_POLICY__PASSWORD_BLACKLIST__BLACKLISTS_PATH=/opt/keycloak/data/password-blacklists \
            -e KC_BOOTSTRAP_ADMIN_CLIENT_ID=ihr-ci -e KC_BOOTSTRAP_ADMIN_CLIENT_SECRET="$ADMIN_SECRET" \
            -v "$PWD/deploy/keycloak/password-blocklist:/opt/keycloak/data/password-blacklists:ro" \
            "$KEYCLOAK_IMAGE" start-dev
          for _ in $(seq 90); do
            curl -fsS http://127.0.0.1:9002/health/ready >/dev/null 2>&1 && exit 0
            sleep 2
          done
          docker logs kc | tail -100
          exit 1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Token-check dependencies (same pins as the backend)
        run: pip install pyjwt==2.15.1 cryptography==50.0.2

      - name: Live tests (throwaway realm, real login pages)
        env:
          IHR_KC_TEST_URL: http://auth.localhost:8081
          IHR_KC_TEST_ADMIN_ID: ihr-ci
          IHR_KC_TEST_SMTP_HOST: mailpit
          IHR_KC_TEST_MAILPIT: http://127.0.0.1:8025
        run: scripts/keycloak-test.sh

      - name: Keycloak log on failure
        if: failure()
        run: docker logs kc 2>&1 | tail -200

  frontend:
    name: Frontend (typecheck, lint, unit tests, build)
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no step pushes or calls the API with it
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: apps/frontend/.node-version
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate supported browsers
        run: npm run supported-browsers

      - name: Type check
        run: npm run typecheck
      - name: Type check (browser specs, tests-ihr, P1-T1d)
        run: npx tsc -p tests-ihr/tsconfig.json
      - name: Browser storage keys are classified (tests-ihr/storage-keys.json, P1-T1d)
        working-directory: .
        run: |
          python3 -m unittest scripts/test_check_storage_keys.py
          python3 scripts/check-storage-keys.py

      - name: Lint
        run: npm run lint -- --quiet

      - name: Unit tests
        run: npm run test:unit
      - name: IndieHR unit tests (src/Utils/ihr)
        run: node --import tsx --test src/Utils/ihr/*.test.ts

      - name: Our translations (deploy/locale, P1-T7c)
        working-directory: .
        run: python3 scripts/merge-locale.py

      - name: Production build (IndieHR settings, not OHC defaults)
        run: |
          set -a; . ../../deploy/frontend.env; set +a
          REACT_CARE_API_URL=http://localhost:9000 npm run build

      - name: Egress check (no unreviewed external hosts in bundle)
        working-directory: .
        run: scripts/check-bundle-egress.sh apps/frontend/build

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build hardened frontend image (non-root nginx)
        working-directory: .
        run: |
          docker buildx build --load \
            -f deploy/docker/frontend.Dockerfile \
            --build-context config=deploy/docker \
            -t indiehr-frontend:ci apps/frontend/build

      - name: Smoke test frontend image
        working-directory: .
        run: |
          docker run -d --name fe -p 8080:8080 -e CSP_API_ORIGIN=http://localhost:9000 indiehr-frontend:ci
          sleep 3
          test "$(docker exec fe id -u)" != "0"
          curl -fsS http://127.0.0.1:8080/ | grep -qi "<html"
          curl -fsS -o /dev/null http://127.0.0.1:8080/patients
          curl -fsSI http://127.0.0.1:8080/ | grep -qi "x-content-type-options: nosniff"
          curl -fsSI http://127.0.0.1:8080/ | grep -i "^content-security-policy:" | grep -q "connect-src 'self' http://localhost:9000"
          # Hospital branding script is loaded first; without API_UPSTREAM the API path is a 404
          curl -fsS http://127.0.0.1:8080/ | grep -qF '<script src="/api/ihr/bootstrap.js"></script>'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/ihr/bootstrap.js)" = 404
          docker rm -f fe

  # P1-T1d (TENANCY_DESIGN §11.4): Playwright on two hospital addresses against the dev stack
  # (scripts/care-dev.sh, tenant mode, Keycloak), with a same-origin bundle built here exactly
  # like frontend-bundle.yml. Specs: apps/frontend/tests-ihr. The repository and its artifacts
  # are public: every generated secret is masked first, no trace/video/report is kept, and a
  # failure uploads only screenshots (never with a password or code field) and small JSON files.
  browser:
    name: Browser isolation (Playwright)
    needs: changes
    if: needs.changes.outputs.browser == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    # Unmeasured yet (a cache miss rebuilds the dev image): tighten to the measured time plus
    # a margin after the first real runs, one with the gha cache hit and one without.
    timeout-minutes: 60
    env:
      # Playwright 1.61.1's Chromium (headless shell) and its FFmpeg, pinned by SHA-256
      # (docs/VERSIONS.md). Fetched and checked here, then served to `playwright install`
      # from 127.0.0.1, so it installs exactly the checked archives and nothing else.
      PW_CHROMIUM_PATH: builds/cft/149.0.7827.55/linux64/chrome-headless-shell-linux64.zip
      PW_CHROMIUM_SHA256: 410c9407d5de3fea80d9398666be06f2aa09154a3fa7b327dc254e336bb4c4b7
      PW_FFMPEG_PATH: builds/ffmpeg/1011/ffmpeg-linux.zip
      PW_FFMPEG_SHA256: ebc74fc5b94830176a3c2914ae96bd8bc7f6a91f4f33890230f84a172ee61ccc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no step pushes or calls the API with it

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build dev image (gha cache, with the label care-dev.sh checks so it never rebuilds)
        run: |
          want="$(cat apps/backend/Pipfile.lock apps/backend/docker/dev.Dockerfile | sha256sum | cut -c1-16)"
          docker buildx build \
            --file apps/backend/docker/dev.Dockerfile \
            --tag care_local \
            --label "indiehr.deps=$want" \
            --cache-from type=gha,scope=backend \
            --load apps/backend

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: apps/frontend/.node-version
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        working-directory: apps/frontend
        run: npm ci

      - name: Our translations (deploy/locale, P1-T7c)
        run: python3 scripts/merge-locale.py

      - name: Build bundle, same origin (as frontend-bundle.yml with an empty api_url)
        working-directory: apps/frontend
        run: |
          set -a; . ../../deploy/frontend.env; set +a
          REACT_APP_TITLE="IndieHR (dev)" REACT_CARE_API_URL="" npm run build
          grep -qF '<script src="/api/ihr/bootstrap.js"></script>' build/index.html

      - name: Egress check (no unreviewed external hosts in bundle)
        run: |
          scripts/check-bundle-egress.sh apps/frontend/build
          rm -rf deploy/dev/frontend-build
          cp -r apps/frontend/build deploy/dev/frontend-build

      # care-dev.sh writes its own git-ignored env files on first use, each with fresh random
      # values (deploy/dev/keycloak.env, s3-gateway.env, s3-care.env, audit-anchor-*.env, and
      # the client-keys folder): throwaway secrets that die with the runner. Each step that
      # writes new ones masks them from an EXIT trap, so the masks are registered even when the
      # step fails (the failure dumps below run afterwards). The mask script fails closed: if
      # its inputs change shape, the step fails (exit inside the trap sets the step's status).
      - name: Start the dev stack (tenant mode), then mask its generated secrets
        run: |
          trap 'python3 scripts/ci-mask-dev-secrets.py || exit 1' EXIT
          scripts/care-dev.sh up

      - name: Two synthetic hospitals (alpha, beta), then mask their passwords
        run: |
          trap 'python3 scripts/ci-mask-dev-secrets.py || exit 1' EXIT
          scripts/care-dev.sh seed

      - name: Keycloak, then its synthetic staff; mask their passwords and authenticator keys
        run: |
          trap 'python3 scripts/ci-mask-dev-secrets.py || exit 1' EXIT
          scripts/care-dev.sh keycloak up
          scripts/care-dev.sh keycloak seed

      - name: Serve the bundle (hospital addresses on 127.0.0.1:8080)
        run: |
          scripts/care-dev.sh frontend
          for slug in alpha beta; do
            curl -fsS --retry 10 --retry-all-errors --retry-delay 2 \
              --resolve "$slug.localhost:8080:127.0.0.1" \
              "http://$slug.localhost:8080/api/ihr/bootstrap.js" | grep -q '__IHR_AUTH__'
          done

      - name: Chromium for Playwright 1.61.1 (archives checked by SHA-256, installed from them)
        working-directory: apps/frontend
        run: |
          set -euo pipefail
          test "$(npx playwright --version)" = "Version 1.61.1"
          # Playwright must want exactly the pinned archives (a version bump fails here)
          plan="$(npx playwright install --dry-run --only-shell chromium)"
          grep -qF "/$PW_CHROMIUM_PATH" <<<"$plan"
          grep -qF "/$PW_FFMPEG_PATH" <<<"$plan"
          mirror="$RUNNER_TEMP/pw-mirror"
          mkdir -p "$mirror/$(dirname "$PW_CHROMIUM_PATH")" "$mirror/$(dirname "$PW_FFMPEG_PATH")"
          curl -fsSL --retry 5 --retry-all-errors -o "$mirror/$PW_CHROMIUM_PATH" "https://cdn.playwright.dev/$PW_CHROMIUM_PATH"
          curl -fsSL --retry 5 --retry-all-errors -o "$mirror/$PW_FFMPEG_PATH" "https://cdn.playwright.dev/dbazure/download/playwright/$PW_FFMPEG_PATH"
          printf '%s  %s\n' "$PW_CHROMIUM_SHA256" "$mirror/$PW_CHROMIUM_PATH" \
            "$PW_FFMPEG_SHA256" "$mirror/$PW_FFMPEG_PATH" | sha256sum -c -
          python3 -m http.server 8099 --bind 127.0.0.1 --directory "$mirror" >/dev/null 2>&1 &
          server=$!
          sleep 1
          # --with-deps: system libraries from the runner's own Ubuntu archive (apt)
          PLAYWRIGHT_DOWNLOAD_HOST=http://127.0.0.1:8099 \
            npx playwright install --with-deps --only-shell --no-progress chromium
          kill "$server"
          rm -rf "$mirror"

      - name: One-time codes match RFC 6238 and our Keycloak rule
        working-directory: apps/frontend
        run: node --import tsx --test tests-ihr/lib/totp.test.ts

      # The "preflight" project signs in once first; if Keycloak refuses the code, no other
      # spec types one (no account is locked). Sign-in parameters are stripped from the output.
      - name: Browser specs (alpha.localhost and beta.localhost)
        working-directory: apps/frontend
        env:
          IHR_E2E_STATE: ${{ runner.temp }}/ihr-e2e-totp-state.json
        run: |
          set -o pipefail
          npx playwright test -c playwright.ihr.config.ts 2>&1 \
            | sed -E 's/(code|state|session_state)=[^&[:space:]"]*/\1=[removed]/g'

      - name: Failure evidence (screenshots without password or code fields, scrubbed JSON)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-isolation-failures
          path: |
            apps/frontend/test-results-ihr/**/*.png
            apps/frontend/test-results-ihr/**/failure.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Service logs on failure (secrets masked first, sign-in parameters stripped)
        if: failure()
        run: |
          # Backstop: register every mask again before anything is printed (fails closed)
          python3 scripts/ci-mask-dev-secrets.py
          {
            scripts/care-dev.sh ps
            scripts/care-dev.sh logs backend celery
            scripts/care-dev.sh keycloak logs
            docker logs --tail=100 indiehr-frontend
          } 2>&1 | sed -E 's/(code|state|session_state)=[^&[:space:]"]*/\1=[removed]/g'

  security:
    name: Security scan (Trivy)
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.infra == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no step pushes or calls the API with it
      - name: Scan dependencies and IaC (report all)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
          format: table
          trivyignores: .trivyignore.yaml

      - name: Fail on fixable HIGH/CRITICAL vulnerabilities, misconfigurations or secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          exit-code: "1"
          format: table
          skip-setup-trivy: true

  backend-image:
    name: Backend production image (build, smoke, Trivy image scan)
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no step pushes or calls the API with it

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build production image (deploy/docker/backend.Dockerfile)
        run: |
          docker buildx build --load \
            --cache-from type=gha,scope=backend-prod \
            --cache-to type=gha,mode=max,scope=backend-prod \
            --build-context plugins=plugins \
            -f deploy/docker/backend.Dockerfile -t indiehr-backend:ci apps/backend

      - name: Smoke test (app imports work, pip removed)
        run: |
          docker run --rm indiehr-backend:ci python -c "import django, celery, rest_framework; print('django', django.get_version())"
          docker run --rm indiehr-backend:ci python -c "import ihr_platform.settings.secure, ihr_audit, ihr_identity, ihr_tenant_settings"
          # With only a database address the server must refuse to start, naming our rules (P1-T8a)
          if docker run --rm -e DATABASE_URL=postgres://u:p@db:5432/x -e REDIS_URL=redis://redis:6379 \
              indiehr-backend:ci python manage.py check > refusal.txt 2>&1; then
            echo "started without secrets"; exit 1
          fi
          for rule in "Refusing to start with unsafe settings" "DJANGO_SECRET_KEY is not set." \
              "JWKS_BASE64 is not set." "'*' is not allowed"; do
            grep -qF "$rule" refusal.txt || { echo "missing refusal: $rule"; tail -20 refusal.txt; exit 1; }
          done
          if docker run --rm indiehr-backend:ci sh -c 'touch /ihr/plugins/ihr_platform/x'; then echo "plugins writable"; exit 1; fi
          if docker run --rm indiehr-backend:ci python -m pip --version; then echo "pip should not be in the image"; exit 1; fi

      - name: Runs as non-root
        run: |
          user=$(docker image inspect indiehr-backend:ci --format '{{.Config.User}}')
          echo "image user: ${user:-<root>}"
          test -n "$user" && test "$user" != "root" && test "$user" != "0"

      - name: Trivy image scan (OS + Python packages; fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: indiehr-backend:ci
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          exit-code: "1"
          format: table

  acme-proof:
    name: Certificate proof (acme-dns image, Trivy, Pebble)
    needs: changes
    if: needs.changes.outputs.infra == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no step pushes or calls the API with it

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build acme-dns (deploy/docker/acme-dns.Dockerfile; runs upstream's tests)
        run: docker buildx build --load -f deploy/docker/acme-dns.Dockerfile -t indiehr-acme-dns:ci deploy/docker

      - name: Runs as non-root, no shell
        run: |
          test "$(docker image inspect indiehr-acme-dns:ci --format '{{.Config.User}}')" = "65532:65532"
          if docker run --rm --entrypoint /bin/sh indiehr-acme-dns:ci -c true; then echo "image has a shell"; exit 1; fi

      - name: Trivy image scan (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: indiehr-acme-dns:ci
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          exit-code: "1"
          format: table

      - name: Wildcard certificate from Pebble through acme-dns, renewal (P1-T8b2)
        run: |
          command -v dig >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q dnsutils; }
          IHR_ACMEDNS_IMAGE=indiehr-acme-dns:ci scripts/staging.sh acme-proof

  postgres-image:
    name: Postgres image (pgBackRest build, smoke, Trivy)
    needs: changes
    if: needs.changes.outputs.infra == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no step pushes or calls the API with it

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build (deploy/docker/postgres.Dockerfile)
        run: docker buildx build --load -f deploy/docker/postgres.Dockerfile -t indiehr-postgres:ci deploy/docker

      - name: Smoke (starts as postgres with no capabilities, pgBackRest present, no gosu)
        run: |
          set -euo pipefail
          test "$(docker image inspect indiehr-postgres:ci --format '{{.Config.User}}')" = postgres
          docker run --rm --entrypoint sh indiehr-postgres:ci -c 'pgbackrest version && ! test -e /usr/local/bin/gosu'
          docker run -d --name pg --cap-drop ALL --security-opt no-new-privileges:true -e POSTGRES_PASSWORD=ci-only indiehr-postgres:ci
          for _ in $(seq 1 30); do docker exec pg pg_isready -q && break; sleep 2; done
          test "$(docker exec pg psql -U postgres -Atc 'select current_user')" = postgres
          docker rm -f pg

      - name: Trivy image scan (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: indiehr-postgres:ci
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          exit-code: "1"
          format: table

  keycloak-image:
    name: Keycloak image (optimized build, smoke, Trivy)
    needs: changes
    if: needs.changes.outputs.infra == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      POSTGRES_IMAGE: postgres:18.6-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no step pushes or calls the API with it

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build (deploy/docker/keycloak.Dockerfile)
        run: docker buildx build --load -f deploy/docker/keycloak.Dockerfile -t indiehr-keycloak:ci deploy/docker

      - name: Smoke (starts optimized, single-node cache, ready only with HTTP 200, build options fixed)
        run: |
          set -euo pipefail
          test "$(docker image inspect indiehr-keycloak:ci --format '{{.Config.User}}')" = 1000
          docker run --rm indiehr-keycloak:ci show-config | grep -E 'kc\.db +=  postgres \(Persisted\)'
          pw="$(openssl rand -hex 16)"
          docker network create kc
          docker run -d --name kc-db --network kc -e POSTGRES_USER=keycloak -e POSTGRES_PASSWORD="$pw" -e POSTGRES_DB=keycloak "$POSTGRES_IMAGE"
          for _ in $(seq 1 30); do docker exec kc-db pg_isready -q -U keycloak && break; sleep 2; done
          docker run -d --name kc --network kc --cap-drop ALL --security-opt no-new-privileges:true \
            -e KC_DB_URL_HOST=kc-db -e KC_DB_URL_DATABASE=keycloak -e KC_DB_USERNAME=keycloak -e KC_DB_PASSWORD="$pw" \
            -e KC_CACHE=local -e KC_HOSTNAME=https://auth.example.test -e KC_HTTP_ENABLED=true \
            -e KC_PROXY_HEADERS=xforwarded -e KC_PROXY_TRUSTED_ADDRESSES=10.203.0.2 \
            indiehr-keycloak:ci start --optimized
          ready=0
          for _ in $(seq 1 60); do
            if docker exec kc bash -c "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 && head -n1 <&3 | grep -q '^HTTP/1.[01] 200'"; then ready=1; break; fi
            sleep 3
          done
          docker logs kc 2>&1 | tail -20
          test "$ready" = 1
          # No cluster discovery at all, and no rebuild at start
          # (clustered mode would log a JGroups start: ISPN000078; the local proof checks both ways)
          if docker logs kc 2>&1 | grep -qiE 'jgroups|ISPN000078|split-brain|Updating the configuration and installing'; then exit 1; fi
          # A runtime value that differs from the image's build options is refused
          if docker run --rm -e KC_DB=mysql indiehr-keycloak:ci start --optimized --hostname=https://x.test --http-enabled=true > other.log 2>&1; then exit 1; fi
          grep -q 'differ from what is persisted' other.log
          docker rm -f kc kc-db

      - name: Trivy image scan (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: indiehr-keycloak:ci
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          exit-code: "1"
          format: table

  grafana-image:
    name: Grafana image (build, offline smoke, settings, Trivy)
    needs: changes
    if: needs.changes.outputs.infra == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no step pushes or calls the API with it

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build (deploy/docker/grafana.Dockerfile; the logs plugin checked by its SHA-256)
        run: docker buildx build --load -f deploy/docker/grafana.Dockerfile -t indiehr-grafana:ci deploy/docker

      - name: Smoke on a network with no way out (P1-T9d)
        run: |
          set -euo pipefail
          test "$(docker image inspect indiehr-grafana:ci --format '{{.Config.User}}')" = 472
          # Throwaway login for this run only (never stored)
          mkdir -m 755 ci-secrets
          name="ops-$(openssl rand -hex 6)"
          printf 'GF_SECURITY_ADMIN_USER=%s\nGF_SECURITY_ADMIN_EMAIL=%s@admin.invalid\n' "$name" "$name" > ci-secrets/admin.env
          openssl rand -hex 24 | tr -d '\n' > ci-secrets/admin-password
          chmod 644 ci-secrets/*
          docker network create --internal --subnet 10.250.0.0/24 gnet
          docker run -d --name gf --network gnet --ip 10.250.0.10 --read-only --tmpfs /tmp \
            --tmpfs /var/lib/grafana:uid=472,gid=0 --cap-drop ALL --security-opt no-new-privileges:true \
            -e GF_SERVER_HTTP_ADDR=10.250.0.10 -e GF_SERVER_DOMAIN=grafana.localhost \
            -e GF_SERVER_ROOT_URL=http://grafana.localhost:3000/ -e GF_SERVER_ENFORCE_DOMAIN=true \
            -e GF_AUTH_BASIC_ENABLED=false -e GF_SECURITY_ADMIN_PASSWORD__FILE=/run/s/admin-password \
            -e GF_LOG_LEVEL=debug \
            --env-file ci-secrets/admin.env -v "$PWD/ci-secrets:/run/s:ro" indiehr-grafana:ci
          up=0
          for _ in $(seq 1 40); do
            if curl -fsS -H 'Host: grafana.localhost:3000' http://10.250.0.10:3000/api/health >/dev/null 2>&1; then up=1; break; fi
            sleep 3
          done
          test "$up" = 1 || { docker logs gf 2>&1 | tail -40; exit 1; }
          # A minute past start-up, at debug level: no logged lookup or dial may have failed (an
          # update check, plugin catalog, news or usage report would show here). The network has
          # no way out anyway; the settings read-back below is the main check.
          sleep 60
          # grafana.com points at 127.0.0.1:9 in the image: an attempt to reach it is a refused dial
          # (a line merely naming an address, such as the settings or a docs link, is fine)
          if docker logs gf 2>&1 | grep -iE 'dial tcp|connection refused|lookup .* on|network is unreachable|no such host|raintank|stats\.grafana\.org'; then
            echo "Grafana tried to reach something outside"; exit 1
          fi
          python3 scripts/check-dashboards.py --url http://10.250.0.10:3000 --domain grafana.localhost \
            --admin-env ci-secrets/admin.env --password-file ci-secrets/admin-password --image-only
          docker rm -f gf

      - name: Trivy image scan (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: indiehr-grafana:ci
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          exit-code: "1"
          format: table

  infra-tofu:
    name: Infra modules (OpenTofu fmt, validate, mock tests)
    needs: changes
    if: needs.changes.outputs.infra == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TOFU_VERSION: 1.13.9
      # OpenTofu's release signing key (https://get.opentofu.org/opentofu.asc)
      TOFU_KEY_FPR: E3E6E43D84CB852EADB0051D0C0AF313E5FD9F80
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no step pushes or calls the API with it

      - name: Install OpenTofu (signature and checksum checked)
        run: |
          set -euo pipefail
          d="$(mktemp -d)"; cd "$d"
          base="https://github.com/opentofu/opentofu/releases/download/v${TOFU_VERSION}"
          for f in "tofu_${TOFU_VERSION}_linux_amd64.tar.gz" "tofu_${TOFU_VERSION}_SHA256SUMS" "tofu_${TOFU_VERSION}_SHA256SUMS.gpgsig"; do
            curl -fsSL --retry 5 --retry-all-errors -o "$f" "$base/$f"
          done
          export GNUPGHOME="$d/gnupg"; mkdir -m 700 "$GNUPGHOME"
          curl -fsSL --retry 5 https://get.opentofu.org/opentofu.asc | gpg -q --import
          gpg --status-fd 1 --verify "tofu_${TOFU_VERSION}_SHA256SUMS.gpgsig" "tofu_${TOFU_VERSION}_SHA256SUMS" \
            | grep -q "VALIDSIG ${TOFU_KEY_FPR} "
          grep " tofu_${TOFU_VERSION}_linux_amd64.tar.gz$" "tofu_${TOFU_VERSION}_SHA256SUMS" | sha256sum -c -
          tar -xzf "tofu_${TOFU_VERSION}_linux_amd64.tar.gz" tofu
          sudo install -m 755 tofu /usr/local/bin/tofu
          tofu version

      - name: Format
        run: tofu fmt -check -recursive -diff infra

      - name: Validate and test (mock providers, no cloud account)
        env:
          TF_PROVIDER_DOWNLOAD_RETRY: "8"
        run: |
          set -euo pipefail
          for root in infra/e2e infra/aws infra/aws/anchor; do
            echo "::group::$root"
            (cd "$root" && tofu init -backend=false -input=false -lockfile=readonly \
              && tofu validate && tofu test)
            echo "::endgroup::"
          done

  outdated:
    name: Outdated dependencies report (weekly, report only)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no step pushes or calls the API with it
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Report packages behind their latest stable release
        run: python3 scripts/outdated-report.py
