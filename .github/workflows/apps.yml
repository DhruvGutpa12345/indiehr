name: Apps CI

# Lints, tests and scans the CARE backend/frontend (apps/) and our plugins.
# Heavy jobs run only when their files change, plus weekly and on demand,
# to stay within the private-repo Actions minute budget.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 21 * * 0" # Sundays 03:00 IST
  workflow_dispatch:
    inputs:
      postgres_image:
        description: "Run backend tests on this Postgres image instead of upstream's (e.g. postgres:18.6-alpine)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: apps-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-24.04
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            backend:
              - 'apps/backend/**'
              - 'plugins/**'
              - '.github/workflows/apps.yml'
            frontend:
              - 'apps/frontend/**'
              - 'deploy/docker/frontend*'
              - 'deploy/frontend*'
              - 'scripts/check-bundle-egress.sh'
              - '.github/workflows/apps.yml'

  backend:
    name: Backend (ruff, migrations, fixtures, tests)
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"

      - name: Ruff lint and format check (upstream config)
        run: |
          pip install ruff==0.14.8
          ruff check .
          ruff format --check .

      - uses: docker/setup-buildx-action@v4.4.1

      - name: Build dev image
        run: |
          docker buildx build \
            --file docker/dev.Dockerfile \
            --tag care_local \
            --cache-from type=gha,scope=backend \
            --cache-to type=gha,mode=max,scope=backend \
            --load .

      - name: Use a different Postgres image (manual runs only)
        if: github.event_name == 'workflow_dispatch' && inputs.postgres_image != ''
        env:
          PG_IMAGE: ${{ inputs.postgres_image }}
        run: |
          printf 'services:\n  db:\n    image: %s\n' "$PG_IMAGE" > docker-compose.override.ci.yaml
          sed -i "s|docker_config_file := 'docker-compose.local.yaml'|docker_config_file := 'docker-compose.local.yaml' -f docker-compose.override.ci.yaml|" Makefile
          echo "Postgres image for this run: $PG_IMAGE"

      - name: Start services
        run: make up || (docker compose -f docker-compose.yaml -f docker-compose.local.yaml logs && exit 1)

      - name: Report Postgres version
        run: docker compose exec -T db psql -U postgres -tAc "select version()"

      - name: Check for missing migrations
        run: make checkmigration

      - name: Validate fixtures load
        run: make load-fixtures

      - name: Run test suite
        run: make test

      - name: Service logs on failure
        if: failure()
        run: docker compose -f docker-compose.yaml -f docker-compose.local.yaml logs --tail=200

  frontend:
    name: Frontend (typecheck, lint, unit tests, build)
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: apps/frontend/.node-version
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate supported browsers
        run: npm run supported-browsers

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint -- --quiet

      - name: Unit tests
        run: npm run test:unit

      - name: Production build (IndieHR settings, not OHC defaults)
        run: |
          set -a; . ../../deploy/frontend.env; set +a
          REACT_CARE_API_URL=http://localhost:9000 npm run build

      - name: Egress check (no unreviewed external hosts in bundle)
        working-directory: .
        run: scripts/check-bundle-egress.sh apps/frontend/build

      - uses: docker/setup-buildx-action@v4.4.1

      - name: Build hardened frontend image (non-root nginx)
        working-directory: .
        run: |
          docker buildx build --load \
            -f deploy/docker/frontend.Dockerfile \
            --build-context config=deploy/docker \
            -t indiehr-frontend:ci apps/frontend/build

      - name: Smoke test frontend image
        working-directory: .
        run: |
          docker run -d --name fe -p 8080:8080 -e CSP_API_ORIGIN=http://localhost:9000 indiehr-frontend:ci
          sleep 3
          test "$(docker exec fe id -u)" != "0"
          curl -fsS http://127.0.0.1:8080/ | grep -qi "<html"
          curl -fsS -o /dev/null http://127.0.0.1:8080/patients
          curl -fsSI http://127.0.0.1:8080/ | grep -qi "x-content-type-options: nosniff"
          curl -fsSI http://127.0.0.1:8080/ | grep -i "^content-security-policy:" | grep -q "connect-src 'self' http://localhost:9000"
          docker rm -f fe

  security:
    name: Security scan (Trivy)
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Scan dependencies and IaC (report all)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
          format: table
          trivyignores: .trivyignore.yaml

      - name: Fail on fixable HIGH/CRITICAL vulnerabilities or misconfigurations
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          exit-code: "1"
          format: table
          skip-setup-trivy: true
