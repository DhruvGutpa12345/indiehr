name: Apps CI

# Lints, tests and scans the CARE backend/frontend (apps/) and our plugins.
# Heavy jobs run only when their files change, plus weekly and on demand,
# to stay within the private-repo Actions minute budget.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 21 * * 0" # Sundays 03:00 IST
  workflow_dispatch:
    inputs:
      postgres_image:
        description: "Run backend tests on this Postgres image instead of upstream's (e.g. postgres:18.6-alpine)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: apps-ci-${{ github.ref }}
  # Never cancel runs on main, so every commit there gets a verdict
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-24.04
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
      isolation: ${{ steps.filter.outputs.isolation }}
      keycloak: ${{ steps.filter.outputs.keycloak }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            backend:
              - 'apps/backend/**'
              - 'plugins/**'
              - 'deploy/docker/backend.Dockerfile'
              - 'deploy/ci/**'
              - 'scripts/isolation-mutation.sh'
              - '.github/workflows/apps.yml'
            frontend:
              - 'apps/frontend/**'
              - 'plugins/**'
              - 'deploy/docker/frontend*'
              - 'deploy/frontend*'
              - 'scripts/check-bundle-egress.sh'
              - '.github/workflows/apps.yml'
            # Mutation runs cost ~10 jobs: only when an isolation control or its tests change
            isolation:
              - 'plugins/ihr_platform/**'
              - 'scripts/isolation-mutation.sh'
              - 'apps/backend/config/patient_otp_token.py'
              - 'apps/backend/care/emr/signals/patient/base.py'
              - 'apps/backend/care/emr/models/valueset.py'
              - 'apps/backend/care/emr/models/patient.py'
              - 'apps/backend/care/emr/utils/file_manager.py'
              - 'apps/backend/care/utils/file_uploads/cover_image.py'
              - 'apps/backend/config/celery_app.py'
              - 'apps/backend/config/patient_otp_authentication.py'
              - 'apps/backend/config/settings/**'
              - 'apps/backend/care/emr/resources/base.py'
              - 'apps/backend/care/emr/utils/reset_password.py'
              - 'deploy/ci/**'
              - '.github/workflows/apps.yml'
              - 'upstream.lock'
            keycloak:
              - 'plugins/ihr_platform/ihr_platform/keycloak/**'
              - 'plugins/ihr_platform/ihr_identity/tokens.py'
              - 'deploy/keycloak/**'
              - 'deploy/dev/keycloak*'
              - 'scripts/keycloak*'
              - '.github/workflows/apps.yml'
            infra:
              - 'deploy/**'
              - 'scripts/**'
              - '.trivyignore.yaml'
              - '.github/workflows/**'

  backend:
    name: Backend (ruff, migrations, fixtures, tests)
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Ruff lint and format check (upstream config)
        run: |
          pip install ruff==0.14.8
          ruff check .
          ruff format --check .

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build dev image
        run: |
          docker buildx build \
            --file docker/dev.Dockerfile \
            --tag care_local \
            --cache-from type=gha,scope=backend \
            --cache-to type=gha,mode=max,scope=backend \
            --load .

      - name: Use a different Postgres image (manual runs only)
        if: github.event_name == 'workflow_dispatch' && inputs.postgres_image != ''
        env:
          PG_IMAGE: ${{ inputs.postgres_image }}
        run: |
          # Postgres 18+ images keep data under /var/lib/postgresql (not .../data)
          printf 'services:\n  db:\n    image: %s\n    volumes: !override\n      - pg-ci-data:/var/lib/postgresql\nvolumes:\n  pg-ci-data: {}\n' "$PG_IMAGE" > docker-compose.override.ci.yaml
          cat docker-compose.override.ci.yaml
          sed -i "s|docker_config_file := 'docker-compose.local.yaml'|docker_config_file := 'docker-compose.local.yaml' -f docker-compose.override.ci.yaml|" Makefile
          echo "Postgres image for this run: $PG_IMAGE"

      - name: Start services
        run: make up || (docker compose -f docker-compose.yaml -f docker-compose.local.yaml logs && exit 1)

      - name: Report Postgres version
        run: docker compose exec -T db psql -U postgres -tAc "select version()"

      - name: Check for missing migrations
        run: make checkmigration

      - name: Validate fixtures load
        run: make load-fixtures

      - name: Run test suite
        run: make test

      - name: Service logs on failure
        if: failure()
        run: docker compose -f docker-compose.yaml -f docker-compose.local.yaml logs --tail=200

  backend-tenant:
    name: Backend in tenant mode (CARE suite inside a tenant schema)
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/backend
    env:
      COMPOSE: docker compose -f docker-compose.yaml -f docker-compose.local.yaml -f ../../deploy/ci/tenancy.override.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build dev image
        run: |
          docker buildx build \
            --file docker/dev.Dockerfile \
            --tag care_local \
            --cache-from type=gha,scope=backend \
            --load .

      - name: Start services (with ihr_platform mounted)
        run: $COMPOSE up -d --wait || ($COMPOSE logs && exit 1)

      - name: CARE suite + ihr_platform tests inside a tenant schema
        run: |
          set +e
          $COMPOSE exec -T backend python manage.py test --settings=ihr_platform.settings.test --noinput -v 2 ihr_platform ihr_tenant_settings ihr_identity . > tenant-tests.log 2>&1
          status=$?
          grep -vE "\.\.\. ok$" tenant-tests.log | tail -400
          exit $status

      - name: Summary
        if: always()
        run: |
          grep -E "^Ran [0-9]+ tests|^OK|^FAILED|Tenant mode" tenant-tests.log || true
          grep -E "^(ERROR|FAIL):" tenant-tests.log | sort | uniq -c | sort -rn | head -40 || true

      - name: Service logs on failure
        if: failure()
        run: $COMPOSE logs --tail=200

  mutation-list:
    name: Isolation mutations (list)
    needs: changes
    if: needs.changes.outputs.isolation == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      names: ${{ steps.list.outputs.names }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Every mutation target still exists
        run: scripts/isolation-mutation.sh check
      - id: list
        run: echo "names=$(scripts/isolation-mutation.sh list | jq -Rnc '[inputs]')" >> "$GITHUB_OUTPUT"

  # TENANCY_DESIGN.md §11.2: remove one isolation control at a time; the isolation suite must
  # then fail on the test that guards it. A green run here means a test has stopped guarding.
  isolation-mutation:
    name: Isolation mutation (${{ matrix.mutation }} must fail)
    needs: mutation-list
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        mutation: ${{ fromJSON(needs.mutation-list.outputs.names) }}
    defaults:
      run:
        working-directory: apps/backend
    env:
      COMPOSE: docker compose -f docker-compose.yaml -f docker-compose.local.yaml -f ../../deploy/ci/tenancy.override.yaml
      MUTATION: ${{ matrix.mutation }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build dev image
        run: |
          docker buildx build \
            --file docker/dev.Dockerfile \
            --tag care_local \
            --cache-from type=gha,scope=backend \
            --load .

      - name: Remove the control
        run: ../../scripts/isolation-mutation.sh apply "$MUTATION"

      - name: Start services (with ihr_platform mounted)
        run: $COMPOSE up -d --wait || ($COMPOSE logs && exit 1)

      - name: The guarding tests must fail
        run: |
          read -r -a labels <<<"$(../../scripts/isolation-mutation.sh test "$MUTATION")"
          set +e
          $COMPOSE exec -T backend python manage.py test --settings=ihr_platform.settings.test --noinput -v 2 "${labels[@]}" > mutation.log 2>&1
          status=$?
          set -e
          grep -E "^(FAIL|ERROR):|^Ran |^OK|^FAILED|Error:" mutation.log | head -40 || true
          if [ "$status" -eq 0 ]; then
            echo "::error::Mutation $MUTATION survived: the suite stayed green without this control"
            exit 1
          fi
          while read -r expect; do
            if ! grep -qE "$expect" mutation.log; then
              echo "::error::Mutation $MUTATION: no line matching '$expect'"
              tail -150 mutation.log
              exit 1
            fi
          done < <(../../scripts/isolation-mutation.sh expect "$MUTATION")
          echo "Mutation $MUTATION killed, as required."

  keycloak:
    name: Keycloak live tests
    needs: changes
    if: needs.changes.outputs.keycloak == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Same image as deploy/dev/keycloak.override.yaml (docs/VERSIONS.md)
      KEYCLOAK_IMAGE: quay.io/keycloak/keycloak:26.8.2@sha256:3879c623248408de29a5303178b5816c77e8dfef3890c361f8c0bbeaa979ba3b
      POSTGRES_IMAGE: postgres:18.6-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start Postgres and Keycloak (throwaway secrets)
        run: |
          DB_PW="$(openssl rand -hex 16)"
          ADMIN_SECRET="$(openssl rand -hex 24)"
          echo "::add-mask::$ADMIN_SECRET"
          echo "IHR_KC_TEST_ADMIN_SECRET=$ADMIN_SECRET" >> "$GITHUB_ENV"
          docker network create kc
          docker run -d --name kc-db --network kc -e POSTGRES_USER=keycloak \
            -e POSTGRES_PASSWORD="$DB_PW" -e POSTGRES_DB=keycloak "$POSTGRES_IMAGE"
          docker run -d --name kc --network kc -p 127.0.0.1:8081:8080 -p 127.0.0.1:9002:9000 \
            -e KC_DB=postgres -e KC_DB_URL_HOST=kc-db -e KC_DB_URL_DATABASE=keycloak \
            -e KC_DB_USERNAME=keycloak -e KC_DB_PASSWORD="$DB_PW" \
            -e KC_HOSTNAME=http://auth.localhost:8081 -e KC_HEALTH_ENABLED=true \
            -e KC_FEATURES_DISABLED=device-flow,ciba,impersonation,kerberos \
            -e KC_SPI_PASSWORD_POLICY__PASSWORD_BLACKLIST__BLACKLISTS_PATH=/opt/keycloak/data/password-blacklists \
            -e KC_BOOTSTRAP_ADMIN_CLIENT_ID=ihr-ci -e KC_BOOTSTRAP_ADMIN_CLIENT_SECRET="$ADMIN_SECRET" \
            -v "$PWD/deploy/keycloak/password-blocklist:/opt/keycloak/data/password-blacklists:ro" \
            "$KEYCLOAK_IMAGE" start-dev
          for _ in $(seq 90); do
            curl -fsS http://127.0.0.1:9002/health/ready >/dev/null 2>&1 && exit 0
            sleep 2
          done
          docker logs kc | tail -100
          exit 1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Token-check dependencies (same pins as the backend)
        run: pip install pyjwt==2.15.1 cryptography==50.0.2

      - name: Live tests (throwaway realm, real login pages)
        env:
          IHR_KC_TEST_URL: http://auth.localhost:8081
          IHR_KC_TEST_ADMIN_ID: ihr-ci
        run: scripts/keycloak-test.sh

      - name: Keycloak log on failure
        if: failure()
        run: docker logs kc 2>&1 | tail -200

  frontend:
    name: Frontend (typecheck, lint, unit tests, build)
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: apps/frontend/.node-version
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate supported browsers
        run: npm run supported-browsers

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint -- --quiet

      - name: Unit tests
        run: npm run test:unit

      - name: Production build (IndieHR settings, not OHC defaults)
        run: |
          set -a; . ../../deploy/frontend.env; set +a
          REACT_CARE_API_URL=http://localhost:9000 npm run build

      - name: Egress check (no unreviewed external hosts in bundle)
        working-directory: .
        run: scripts/check-bundle-egress.sh apps/frontend/build

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build hardened frontend image (non-root nginx)
        working-directory: .
        run: |
          docker buildx build --load \
            -f deploy/docker/frontend.Dockerfile \
            --build-context config=deploy/docker \
            -t indiehr-frontend:ci apps/frontend/build

      - name: Smoke test frontend image
        working-directory: .
        run: |
          docker run -d --name fe -p 8080:8080 -e CSP_API_ORIGIN=http://localhost:9000 indiehr-frontend:ci
          sleep 3
          test "$(docker exec fe id -u)" != "0"
          curl -fsS http://127.0.0.1:8080/ | grep -qi "<html"
          curl -fsS -o /dev/null http://127.0.0.1:8080/patients
          curl -fsSI http://127.0.0.1:8080/ | grep -qi "x-content-type-options: nosniff"
          curl -fsSI http://127.0.0.1:8080/ | grep -i "^content-security-policy:" | grep -q "connect-src 'self' http://localhost:9000"
          # Hospital branding script is loaded first; without API_UPSTREAM the API path is a 404
          curl -fsS http://127.0.0.1:8080/ | grep -qF '<script src="/api/ihr/bootstrap.js"></script>'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/ihr/bootstrap.js)" = 404
          docker rm -f fe

  security:
    name: Security scan (Trivy)
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.infra == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan dependencies and IaC (report all)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
          format: table
          trivyignores: .trivyignore.yaml

      - name: Fail on fixable HIGH/CRITICAL vulnerabilities, misconfigurations or secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          exit-code: "1"
          format: table
          skip-setup-trivy: true

  backend-image:
    name: Backend production image (build, smoke, Trivy image scan)
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build production image (deploy/docker/backend.Dockerfile)
        run: |
          docker buildx build --load \
            --cache-from type=gha,scope=backend-prod \
            --cache-to type=gha,mode=max,scope=backend-prod \
            -f deploy/docker/backend.Dockerfile -t indiehr-backend:ci apps/backend

      - name: Smoke test (app imports work, pip removed)
        run: |
          docker run --rm indiehr-backend:ci python -c "import django, celery, rest_framework; print('django', django.get_version())"
          if docker run --rm indiehr-backend:ci python -m pip --version; then echo "pip should not be in the image"; exit 1; fi

      - name: Runs as non-root
        run: |
          user=$(docker image inspect indiehr-backend:ci --format '{{.Config.User}}')
          echo "image user: ${user:-<root>}"
          test -n "$user" && test "$user" != "root" && test "$user" != "0"

      - name: Trivy image scan (OS + Python packages; fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: indiehr-backend:ci
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          exit-code: "1"
          format: table

  outdated:
    name: Outdated dependencies report (weekly, report only)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Report packages behind their latest stable release
        run: python3 scripts/outdated-report.py
