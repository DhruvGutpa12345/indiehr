name: Frontend bundle

# On-demand build of the web app bundle for a given API URL (P0-T5).
# Used for local testing on low-RAM machines: download the artifact and
# serve it with `scripts/care-dev.sh frontend`.

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "Backend API URL baked into the bundle; empty = same origin (/api via nginx, tenant mode)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no step pushes or calls the API with it
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: apps/frontend/.node-version
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - run: npm ci

      - name: Our translations (deploy/locale, P1-T7c)
        working-directory: .
        run: python3 scripts/merge-locale.py

      - name: Build bundle (IndieHR settings, not OHC defaults)
        env:
          API_URL: ${{ inputs.api_url }}
        run: |
          set -a; . ../../deploy/frontend.env; set +a
          REACT_APP_TITLE="IndieHR (dev)" REACT_CARE_API_URL="$API_URL" npm run build
          if [[ -n "$API_URL" ]]; then
            grep -rqF "$API_URL" build/ || { echo "API URL not found in bundle"; exit 1; }
          fi
          grep -qF '<script src="/api/ihr/bootstrap.js"></script>' build/index.html

      - name: Egress check (no unreviewed external hosts in bundle)
        working-directory: .
        run: scripts/check-bundle-egress.sh apps/frontend/build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-bundle
          path: apps/frontend/build
          retention-days: 7
