name: Frontend bundle

# On-demand build of the web app bundle for a given API URL (P0-T5).
# Used for local testing on low-RAM machines: download the artifact and
# serve it with `scripts/care-dev.sh frontend`.

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "Backend API URL baked into the bundle"
        required: true
        default: "http://localhost:9000"

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: apps/frontend/.node-version
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - run: npm ci

      - name: Build bundle
        env:
          REACT_CARE_API_URL: ${{ inputs.api_url }}
          REACT_APP_TITLE: "IndieHR (dev)"
          REACT_ENABLED_APPS: ""
          REACT_RECAPTCHA_SITE_KEY: ""
          REACT_PUBLIC_URL: "http://localhost:8080"
          REACT_APP_COVER_IMAGE: ""
          REACT_APP_COVER_IMAGE_ALT: ""
          REACT_SBOM_BASE_URL: ""
          REACT_APP_STORE_INDEX_URL: ""
          REACT_ALLOWED_LOCALES: "en,hi"
        run: npm run build

      - name: Check API URL is baked in and OHC's API is not
        env:
          API_URL: ${{ inputs.api_url }}
        run: |
          grep -rqF "$API_URL" build/ || { echo "API URL not found in bundle"; exit 1; }
          if grep -rqF "careapi.ohc.network" build/; then echo "OHC API URL still present"; exit 1; fi

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: frontend-bundle
          path: apps/frontend/build
          retention-days: 7
